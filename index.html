            </div>
          </div>
        )}

        {tab === "members" && (
          <div>
            <h2 style={{ margin: "0 0 18px", fontSize: 24, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase" }}>Members</h2>
            <div className="card">
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#e52240", marginBottom: 12 }}>DRC MEMBERSHIP</div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                <span style={{ fontSize: 13, color: "#8a8a8a" }}>Status</span>
                <span style={{ fontSize: 13, fontWeight: 800, color: "#4ade80" }}>ACTIVE</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                <span style={{ fontSize: 13, color: "#8a8a8a" }}>Plan</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{me.membership_type || "—"}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontSize: 13, color: "#8a8a8a" }}>Member since</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: "#fff" }}>{me.member_since ? new Date(me.member_since + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "—"}</span>
              </div>
            </div>
          </div>
        )}

        {renderBottomNav()}
      </div>
    );
  }

  // ── Captain / Admin ───────────────────────────────────────
  if (view === "captain") {
    const inSet = ev ? (checkinMap[ev.id] || new Set()) : new Set();
    const rsvpSet = ev ? (rsvpMap[ev.id] || new Set()) : new Set();
    const checkedCount = inSet.size, rsvpCount = rsvpSet.size;
    const turnoutPct = rsvpCount ? Math.round(checkedCount / rsvpCount * 100) : 0;
    const newCount = allRunners.filter(r => inSet.has(r.id) && r.runs <= 1).length;
    const walkupCount = allRunners.filter(r => inSet.has(r.id) && !rsvpSet.has(r.id)).length;
    const groupHeading = ev && ev.mileage ? "BY MILEAGE GROUP" : "BY PACE GROUP";
    const groupNames = ev && ev.mileage ? DISTANCES : PACES;
    const paceStats = groupNames.map(name => {
      const key = ev && ev.mileage ? "dist" : "pace";
      const inG = allRunners.filter(r => r[key] === name);
      const c = inG.filter(r => inSet.has(r.id)).length;
      return { name, label: c + " / " + inG.length, pct: inG.length ? Math.round(c / inG.length * 100) : 0 };
    });
    const leaders = allRunners.slice().sort((a, b) => b.runs - a.runs).slice(0, 5);
    const noShows = allRunners.filter(r => rsvpSet.has(r.id) && !inSet.has(r.id)).slice(0, 8);
    return (
      <>
      <div className="app-shell" style={{ padding: "20px 18px 90px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: eventPickerOpen ? 0 : 16 }}>
          <button onClick={() => setEventPickerOpen(o => !o)} style={{ background: "none", border: "none", color: "#fff", textAlign: "left", cursor: "pointer" }}>
            <div style={{ fontSize: 10, fontWeight: 800, color: "#e52240" }}>{ev ? eventDateLabel(ev) : "—"} {eventPickerOpen ? "▴" : "▾"}</div>
            <div style={{ fontSize: 17, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase" }}>{ev ? ev.name : "No events yet"}</div>
          </button>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 24, fontWeight: 900, fontStyle: "italic", color: "#e52240" }}>{inSet.size}</div>
            <div style={{ fontSize: 10, color: "#8a8a8a" }}>OF {rsvpSet.size} RSVP</div>
            <button onClick={manualRefresh} disabled={manualRefreshing} style={{ marginTop: 6, background: "none", border: "none", color: "#5a5a5a", fontSize: 10, fontWeight: 800, letterSpacing: ".08em", cursor: "pointer", padding: 0 }}>{manualRefreshing ? "…" : "↻ Refresh"}</button>
          </div>
        </div>

        {eventPickerOpen && (
          <div style={{ border: "1px solid #232323", background: "#0f0f0f", marginBottom: 16, maxHeight: 320, overflowY: "auto" }}>
            {sortedEvents.length === 0 && <div style={{ padding: 16, fontSize: 13, color: "#6a6a6a" }}>No events yet.</div>}
            {sortedEvents.map((x, i) => {
              const past = eventIsPast(x);
              const today = x.event_date === new Date().toISOString().slice(0, 10);
              const selected = i === eventIdx;
              return (
                <button key={x.id} onClick={() => { setEventIdx(i); setEventPickerOpen(false); }} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%",
                  padding: "12px 16px", background: selected ? "#1a0a0e" : "transparent",
                  borderLeft: selected ? "3px solid #e52240" : "3px solid transparent",
                  borderTop: i === 0 ? "none" : "1px solid #1a1a1a", cursor: "pointer", textAlign: "left",
                  opacity: past && !selected ? 0.45 : 1,
                }}>
                  <div>
                    <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".05em", color: selected ? "#e52240" : "#7a7a7a" }}>
                      {eventDateLabel(x).toUpperCase()}{today ? " · TODAY" : (past ? " · PAST" : "")}
                    </div>
                    <div style={{ fontSize: 14, fontWeight: 800, color: selected ? "#fff" : "#d4d4d4" }}>{x.name}</div>
                  </div>
                  {selected && <div style={{ color: "#e52240", fontSize: 16 }}>✓</div>}
                </button>
              );
            })}
          </div>
        )}

        <div style={{ display: "flex", borderTop: "1px solid #1e1e1e", borderBottom: "1px solid #1e1e1e", marginBottom: 16 }}>
          <button onClick={() => switchCaptainTab("checkin")} style={{ flex: 1, minHeight: 46, background: captainTab==="checkin" ? "#e52240" : "transparent", border: "none", color: captainTab==="checkin" ? "#000" : "#fff", fontSize: 12, fontWeight: 900, letterSpacing: ".1em", cursor: "pointer" }}>CHECK-IN</button>
          {role === "admin" && <>
            <button onClick={() => switchCaptainTab("dashboard")} style={{ flex: 1, minHeight: 46, background: captainTab==="dashboard" ? "#e52240" : "transparent", border: "none", color: captainTab==="dashboard" ? "#000" : "#fff", fontSize: 12, fontWeight: 900, letterSpacing: ".1em", cursor: "pointer" }}>DASHBOARD</button>
            <button onClick={() => switchCaptainTab("events")} style={{ flex: 1, minHeight: 46, background: captainTab==="events" ? "#e52240" : "transparent", border: "none", color: captainTab==="events" ? "#000" : "#fff", fontSize: 12, fontWeight: 900, letterSpacing: ".1em", cursor: "pointer" }}>EVENTS</button>
            <button onClick={() => switchCaptainTab("settings")} style={{ flex: 1, minHeight: 46, background: captainTab==="settings" ? "#e52240" : "transparent", border: "none", color: captainTab==="settings" ? "#000" : "#fff", fontSize: 12, fontWeight: 900, letterSpacing: ".1em", cursor: "pointer" }}>SETTINGS</button>
          </>}
        </div>

        {captainTab === "checkin" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {role === "admin" && (
              <button onClick={() => { setView("kiosk"); setKioskResult(null); }} style={{ background: "none", border: "1px dashed #2a2a2a", color: "#8a8a8a", minHeight: 44, borderRadius: 4, fontSize: 11, fontWeight: 800, letterSpacing: ".1em", textTransform: "uppercase", cursor: "pointer" }}>Go to kiosk mode →</button>
            )}
            {scanning ? (
              <CameraScanner onDetect={handleScan} onClose={() => setScanning(false)} />
            ) : scanResult ? (
              <div className="card" style={{ textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 800, color: "#e52240", marginBottom: 8 }}>MEMBER FOUND</div>
                <div style={{ fontSize: 22, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", marginBottom: 6 }}>{scanResult.first_name} {scanResult.last_name}</div>
                <div style={{ fontSize: 12, color: "#8a8a8a", marginBottom: 14 }}>{scanResult.pace} · {scanResult.runs} runs</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button className="btn-primary" onClick={confirmScan}>Check in</button>
                  <button className="btn-ghost" style={{ flex: "0 0 60px" }} onClick={() => setScanResult(null)}>✕</button>
                </div>
              </div>
            ) : (
              <button className="btn-primary" onClick={() => { setScanMsg(""); setScanning(true); }}>Scan a pass</button>
            )}
            {scanMsg && <div className="err">{scanMsg}</div>}

            <div>
              <button className="btn-ghost" onClick={() => setShowGuestForm(s => !s)} style={{ borderStyle: "dashed", color: "#8a8a8a" }}>{showGuestForm ? "CANCEL GUEST CHECK-IN" : "+ CHECK IN A GUEST (NO PASS)"}</button>
              {showGuestForm && (
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <input className="field" placeholder="Guest's name" value={guestName} onChange={e => setGuestName(e.target.value)} />
                  <button className="btn-primary" style={{ width: "auto", padding: "0 18px" }} onClick={addGuestAndCheckIn}>Add</button>
                </div>
              )}
            </div>

            <input className="field" type="search" placeholder="Search all members" value={query} onChange={e => setQuery(e.target.value)} />
            <div style={{ display: "flex", flexDirection: "column" }}>
              {filteredRunners.slice(0, 40).map(r => {
                const isIn = inSet.has(r.id);
                return (
                  <button key={r.id} onClick={() => ev && (isIn ? undoCheckIn(r.id, ev.id) : checkIn(r.id, ev.id))} style={{ display: "flex", justifyContent: "space-between", width: "100%", minHeight: 56, padding: "10px 0", background: "none", border: "none", borderBottom: "1px solid #191919", color: "#fff", cursor: "pointer", opacity: isIn ? 0.55 : 1 }}>
                    <span style={{ textAlign: "left" }}>
                      <div style={{ fontSize: 15, fontWeight: 800 }}>{r.first_name} {r.last_name}</div>
                      <div style={{ fontSize: 11, color: "#7a7a7a" }}>{r.pace} · {r.runs} runs</div>
                    </span>
                    <span style={{ fontSize: 11, fontWeight: 900, padding: "6px 10px", alignSelf: "center", background: isIn ? "#e52240" : "transparent", color: isIn ? "#000" : "#e52240", border: "1px solid #e52240" }}>{isIn ? "IN" : "CHECK IN"}</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {captainTab === "dashboard" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 12 }}>LIVE HEADCOUNT</div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                <span style={{ fontSize: 56, fontWeight: 900, fontStyle: "italic", lineHeight: 0.86, color: "#e52240" }}>{checkedCount}</span>
                <span style={{ fontSize: 15, fontWeight: 700, color: "#6a6a6a" }}>/ {rsvpCount} RSVP'd</span>
              </div>
              <div style={{ height: 8, width: "100%", background: "#1a1a1a", marginTop: 14, overflow: "hidden", boxSizing: "border-box" }}>
                <div style={{ height: "100%", width: turnoutPct + "%", maxWidth: "100%", background: "#e52240", transition: "width .4s ease" }} />
              </div>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#7a7a7a", marginTop: 10 }}>{turnoutPct}% of RSVPs have scanned in</div>
            </div>

            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ flex: 1, background: "#0f0f0f", borderTop: "3px solid #e52240", padding: 16 }}>
                <div style={{ fontSize: 28, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{newCount}</div>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 6 }}>FIRST RUN<br/>TODAY</div>
              </div>
              <div style={{ flex: 1, background: "#0f0f0f", borderTop: "3px solid #2a2a2a", padding: 16 }}>
                <div style={{ fontSize: 28, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{walkupCount}</div>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 6 }}>WALK-UPS<br/>NO RSVP</div>
              </div>
            </div>

            <div>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 12 }}>{groupHeading}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {paceStats.map(g => (
                  <div key={g.name}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, marginBottom: 6 }}>
                      <span style={{ textTransform: "uppercase", letterSpacing: ".05em" }}>{g.name}</span>
                      <span style={{ color: "#8a8a8a" }}>{g.label}</span>
                    </div>
                    <div style={{ height: 6, background: "#1a1a1a" }}><div style={{ height: "100%", width: g.pct + "%", background: "#e52240", transition: "width .35s ease" }} /></div>
                  </div>
                ))}
              </div>
            </div>

            <div>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 12 }}>MOST RUNS · ALL TIME</div>
              <div style={{ display: "flex", flexDirection: "column" }}>
                {leaders.map(s => (
                  <div key={s.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #191919" }}>
                    <span style={{ fontSize: 14, fontWeight: 700 }}>{s.first_name} {s.last_name}</span>
                    <span style={{ fontSize: 12, fontWeight: 800, color: "#e52240", letterSpacing: ".08em" }}>{s.runs} runs</span>
                  </div>
                ))}
              </div>
            </div>

            {noShows.length > 0 && (
              <div>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 12 }}>RSVP'D, NOT HERE YET</div>
                <div style={{ display: "flex", flexDirection: "column" }}>
                  {noShows.map(r => <div key={r.id} style={{ padding: "8px 0", borderBottom: "1px solid #191919", fontSize: 13, fontWeight: 700, color: "#c4c4c4" }}>{r.first_name} {r.last_name}</div>)}
                </div>
              </div>
            )}

            <button className="btn-ghost" style={{ borderColor: "#e52240", color: "#e52240" }} onClick={exportCsv}>Export check-ins to CSV</button>
          </div>
        )}

        {captainTab === "events" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 12 }}>ALL EVENTS</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {sortedEvents.map(x => (
                  <div key={x.id} style={{ border: "1px solid #232323", padding: "14px 16px", opacity: x.cancelled ? 0.55 : 1 }}>
                    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10, marginBottom: 4 }}>
                      <span style={{ fontSize: 15, fontWeight: 800, textTransform: "uppercase" }}>{x.name}</span>
                      {(x.cancelled || x.hold) && <span style={{ fontSize: 10, fontWeight: 900, letterSpacing: ".1em", color: x.cancelled ? "#e52240" : "#e8c34a" }}>{x.cancelled ? "CANCELLED" : "WEATHER HOLD"}</span>}
                    </div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: "#8a8a8a", marginBottom: 12 }}>{eventDateLabel(x)} · {eventTimeLabel(x)} · {eventLocation(x, locations).name}{x.remind ? " · reminder on" : ""}</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => loadEventForm(x)} style={{ flex: 1, minHeight: 40, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 900, letterSpacing: ".12em", background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a" }}>EDIT</button>
                      <button onClick={() => toggleEventHold(x.id)} style={{ flex: 1, minHeight: 40, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 900, letterSpacing: ".12em", background: "transparent", color: x.hold ? "#e8c34a" : "#8a8a8a", border: "1px solid " + (x.hold ? "#e8c34a" : "#2a2a2a") }}>{x.hold ? "LIFT HOLD" : "WEATHER HOLD"}</button>
                      <button onClick={() => toggleEventCancel(x.id)} style={{ flex: 1, minHeight: 40, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 900, letterSpacing: ".12em", background: "transparent", color: x.cancelled ? "#8a8a8a" : "#e52240", border: "1px solid " + (x.cancelled ? "#2a2a2a" : "#e52240") }}>{x.cancelled ? "REACTIVATE" : "CANCEL RUN"}</button>
                    </div>

                      deleteConfirmId === x.id ? (
                        <div style={{ marginTop: 10, border: "1px solid #e52240", background: "#1a0a0e", padding: 14, borderRadius: 2 }}>
                          <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Delete {x.name}?</div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: "#cc9999", lineHeight: 1.5, marginBottom: 14 }}>This also deletes its check-in history and RSVPs. This can't be undone.</div>
                          <div style={{ display: "flex", gap: 8 }}>
                            <button onClick={() => deleteEvent(x.id)} style={{ flex: 1, minHeight: 40, background: "#e52240", color: "#000", border: "none", fontSize: 11, fontWeight: 900, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>YES, DELETE</button>
                            <button onClick={() => setDeleteConfirmId(null)} style={{ flex: 1, minHeight: 40, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", fontSize: 11, fontWeight: 800, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>CANCEL</button>
                          </div>
                        </div>
                      ) : (
                        <button onClick={() => setDeleteConfirmId(x.id)} style={{ width: "100%", marginTop: 8, minHeight: 40, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 900, letterSpacing: ".12em", background: "transparent", color: "#e52240", border: "1px solid #e52240" }}>DELETE EVENT</button>
                      )
                    )}
                  </div>
                ))}
              </div>
            </div>

            <div style={{ height: 1, background: "#1e1e1e" }} />

            <div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>

                {editingEventId && <button onClick={newEventForm} style={{ background: "none", border: "none", color: "#e52240", fontSize: 10, fontWeight: 800, letterSpacing: ".1em", cursor: "pointer" }}>+ NEW INSTEAD</button>}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <input className="field" placeholder="Run name" value={eventForm.name} onChange={e => setEventField({ name: e.target.value })} />
                <div style={{ display: "flex", gap: 10 }}>
                  <input className="field" type="date" value={eventForm.event_date} onChange={e => setEventField({ event_date: e.target.value })} style={{ colorScheme: "dark" }} />
                  <input className="field" type="time" value={eventForm.event_time} onChange={e => setEventField({ event_time: e.target.value })} style={{ colorScheme: "dark" }} />
                </div>
                <div>
                  <label className="label">END TIME (OPTIONAL — used to show "happening now")</label>
                  <input className="field" type="time" value={eventForm.event_end_time} onChange={e => setEventField({ event_end_time: e.target.value })} style={{ colorScheme: "dark" }} />
                </div>
                <div>
                  <label className="label">LOCATION</label>
                  <select className="field" value={eventForm.location_id} onChange={e => setEventField({ location_id: e.target.value })}>
                    <option value="">Select a location</option>
                    {locations.map(l => <option key={l.id} value={l.id}>{l.name} — {l.address}</option>)}
                  </select>
                  <button onClick={() => setAddingLocation(a => !a)} style={{ marginTop: 8, background: "none", border: "none", color: "#e52240", fontSize: 11, fontWeight: 800, letterSpacing: ".08em", cursor: "pointer", padding: 0 }}>{addingLocation ? "CANCEL" : "+ ADD NEW LOCATION"}</button>
                  {addingLocation && (
                    <div style={{ border: "1px dashed #2a2a2a", borderRadius: 4, padding: 14, marginTop: 10 }}>
                      <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".16em", color: "#6a6a6a", marginBottom: 10 }}>NEW LOCATION</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        <input className="field" style={{ fontSize: 13, padding: 11 }} placeholder="Location name" value={newLocationName} onChange={e => setNewLocationName(e.target.value)} />
                        <input className="field" style={{ fontSize: 13, padding: 11 }} placeholder="Street address" value={newLocationAddress} onChange={e => setNewLocationAddress(e.target.value)} />
                        <button onClick={addLocation} style={{ minHeight: 38, background: "#e52240", color: "#000", border: "none", fontSize: 12, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", borderRadius: 4, cursor: "pointer" }}>Save location</button>
                      </div>
                    </div>
                  )}
                </div>
                <input className="field" placeholder="Notes, optional" value={eventForm.notes} onChange={e => setEventField({ notes: e.target.value })} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => setEventField({ mileage: false, special: false })} style={{ flex: 1, minHeight: 44, cursor: "pointer", borderRadius: 2, fontSize: 11, fontWeight: 800, letterSpacing: ".08em", background: (!eventForm.mileage && !eventForm.special) ? "#e52240" : "#121212", border: "1px solid " + ((!eventForm.mileage && !eventForm.special) ? "#e52240" : "#2a2a2a"), color: (!eventForm.mileage && !eventForm.special) ? "#000" : "#8a8a8a" }}>WEDNESDAY RUN</button>
                  <button onClick={() => setEventField({ mileage: true, special: false })} style={{ flex: 1, minHeight: 44, cursor: "pointer", borderRadius: 2, fontSize: 11, fontWeight: 800, letterSpacing: ".08em", background: (eventForm.mileage && !eventForm.special) ? "#e52240" : "#121212", border: "1px solid " + ((eventForm.mileage && !eventForm.special) ? "#e52240" : "#2a2a2a"), color: (eventForm.mileage && !eventForm.special) ? "#000" : "#8a8a8a" }}>SATURDAY RUN</button>
                  <button onClick={() => setEventField({ special: true })} style={{ flex: 1, minHeight: 44, cursor: "pointer", borderRadius: 2, fontSize: 11, fontWeight: 800, letterSpacing: ".08em", background: eventForm.special ? "#e52240" : "#121212", border: "1px solid " + (eventForm.special ? "#e52240" : "#2a2a2a"), color: eventForm.special ? "#000" : "#8a8a8a" }}>SPECIAL EVENT</button>
                </div>
                <button onClick={() => setEventField({ remind: !eventForm.remind })} style={{ minHeight: 44, cursor: "pointer", borderRadius: 2, fontSize: 11, fontWeight: 800, letterSpacing: ".1em", background: eventForm.remind ? "#e52240" : "#121212", border: "1px solid " + (eventForm.remind ? "#e52240" : "#2a2a2a"), color: eventForm.remind ? "#000" : "#8a8a8a" }}>REMIND RSVPS</button>
                <button className="btn-primary" onClick={saveEventForm} style={{ marginTop: 4 }}>{editingEventId ? "Save changes" : "Add event"}</button>
                {eventSaveMsg && <div className={eventSaveMsg === "Saved." ? "ok" : "err"}>{eventSaveMsg}</div>}
              </div>
            </div>
          </div>
        )}

        {captainTab === "settings" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            <div>
              <div className="label">RUN STREAKS</div>
              <div style={{ fontSize: 12, color: "#8a8a8a", lineHeight: 1.6, marginBottom: 10 }}>Recalculated automatically every Monday from check-in history. Run it manually if you want to see it update right now.</div>
              <button className="btn-ghost" disabled={recalculating} onClick={recalcStreaksNow}>{recalculating ? "Recalculating…" : "Recalculate streaks now"}</button>
              {streakMsg && <div className={streakMsg.includes("recalculated") ? "ok" : "err"} style={{ marginTop: 10 }}>{streakMsg}</div>}
            </div>

            <div style={{ height: 1, background: "#1e1e1e", margin: "8px 0" }} />
            <div>
              <button onClick={() => setRunsignupExpanded(e => !e)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", marginBottom: runsignupExpanded ? 12 : 0 }}>
                <span className="label" style={{ marginBottom: 0 }}>RUNSIGNUP</span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: runsignupStatus?.connected ? "#4ade80" : "#6a6a6a" }}>{runsignupStatus === null ? "Checking…" : runsignupStatus.connected ? "✓ Connected" : "Not connected"}</span>
                  <span style={{ color: "#6a6a6a", fontSize: 12 }}>{runsignupExpanded ? "▴" : "▾"}</span>
                </span>
              </button>

              {runsignupExpanded && (
                <>
              {runsignupStatus === null ? (
                <div style={{ fontSize: 12, color: "#6a6a6a" }}>Checking…</div>
              ) : runsignupStatus.connected ? (
                <>
                  <div style={{ fontSize: 12, color: "#4ade80", fontWeight: 700, marginBottom: 10 }}>✓ Connected{runsignupStatus.updated_at ? " · last connected " + new Date(runsignupStatus.updated_at).toLocaleDateString() : ""}</div>
                  <a href="https://rghmrznhoqioldpllunt.supabase.co/functions/v1/runsignup-oauth-start" className="btn-ghost" style={{ display: "block", textAlign: "center", textDecoration: "none", lineHeight: "48px" }}>Reconnect RunSignUp</a>
                  <div style={{ fontSize: 11, fontWeight: 500, color: "#5a5a5a", lineHeight: 1.5, marginTop: 8 }}>Use this if your RunSignUp permissions changed since you first connected — it replaces the current connection with a fresh one.</div>
                </>
              ) : (
                <>
                  <div style={{ fontSize: 12, color: "#8a8a8a", lineHeight: 1.6, marginBottom: 10 }}>Not connected. Connecting requires RunSignUp Race Director access.</div>
                  <a href="https://rghmrznhoqioldpllunt.supabase.co/functions/v1/runsignup-oauth-start" className="btn-primary" style={{ display: "block", textAlign: "center", textDecoration: "none", lineHeight: "52px" }}>Connect RunSignUp</a>
                </>
              )}
              {runsignupMsg && <div className={runsignupMsg.includes("Connected") ? "ok" : "err"} style={{ marginTop: 10 }}>{runsignupMsg}</div>}

              <div style={{ marginTop: 16 }}>
                <label className="label">CLUB ID <span style={{ color: "#5a5a5a" }}>(from your MemberOrg dashboard URL, changes yearly)</span></label>
                <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                  <input className="field" value={clubIdInput} onChange={e => setClubIdInput(e.target.value)} placeholder="e.g. 823" />
                  <button className="btn-primary" style={{ width: "auto", padding: "0 18px" }} onClick={saveClubId}>Save</button>
                </div>
                {clubIdMsg && <div className={clubIdMsg.includes("Saved") ? "ok" : "err"} style={{ marginBottom: 12 }}>{clubIdMsg}</div>}

                <label className="label">API CALLER REG TOKEN <span style={{ color: "#5a5a5a" }}>(rsu_api_reg, not the secret)</span></label>
                <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                  <input className="field" value={apiRegInput} onChange={e => setApiRegInput(e.target.value)} placeholder="From API Caller Registration" />
                  <button className="btn-primary" style={{ width: "auto", padding: "0 18px" }} onClick={saveApiReg}>Save</button>
                </div>
                {apiRegMsg && <div className={apiRegMsg.includes("Saved") ? "ok" : "err"} style={{ marginBottom: 12 }}>{apiRegMsg}</div>}

                <label className="label">ORG API KEY <span style={{ color: "#5a5a5a" }}>(rsu_api_key, not the secret — used instead of OAuth for the sync)</span></label>
                <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                  <input className="field" value={orgKeyInput} onChange={e => setOrgKeyInput(e.target.value)} placeholder="Org-level API key" />
                  <button className="btn-primary" style={{ width: "auto", padding: "0 18px" }} onClick={saveOrgKey}>Save</button>
                </div>
                {orgKeyMsg && <div className={orgKeyMsg.includes("Saved") ? "ok" : "err"} style={{ marginBottom: 12 }}>{orgKeyMsg}</div>}
                <div style={{ fontSize: 11, fontWeight: 500, color: "#5a5a5a", lineHeight: 1.5, marginBottom: 12 }}>Neither secret is entered here — both get stored directly in Supabase Vault via SQL, not through the app.</div>

                <button className="btn-ghost" disabled={membershipSyncing} onClick={startMembershipSync}>{membershipSyncing ? "Working…" : "Sync membership now"}</button>
                {membershipSyncMsg && <div className={membershipSyncMsg.includes("done") ? "ok" : "err"} style={{ marginTop: 10 }}>{membershipSyncMsg}</div>}

                <div style={{ height: 1, background: "#1e1e1e", margin: "16px 0" }} />
                <label className="label">FIX A MEMBER'S JOIN DATE <span style={{ color: "#5a5a5a" }}>(overrides what the sync pulls from RunSignUp)</span></label>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 8 }}>
                  <input className="field" type="email" value={memberSinceEmail} onChange={e => setMemberSinceEmail(e.target.value)} placeholder="Their email" />
                  <input className="field" type="date" value={memberSinceDate} onChange={e => setMemberSinceDate(e.target.value)} style={{ colorScheme: "dark" }} />
                  <button className="btn-primary" onClick={saveMemberSince}>Save</button>
                </div>
                {memberSinceMsg && <div className={memberSinceMsg.includes("Saved") ? "ok" : "err"}>{memberSinceMsg}</div>}
              </div>
                </>
              )}
            </div>

            <div style={{ height: 1, background: "#1e1e1e", margin: "8px 0" }} />
            <div>
              <button onClick={() => setRaceSyncExpanded(e => !e)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", marginBottom: raceSyncExpanded ? 12 : 0 }}>
                <span className="label" style={{ marginBottom: 0 }}>RACE SYNC</span>
                <span style={{ color: "#6a6a6a", fontSize: 12 }}>{raceSyncExpanded ? "▴" : "▾"}</span>
              </button>

              {raceSyncExpanded && (
                <>
                  <label className="label">RACE ID <span style={{ color: "#5a5a5a" }}>(from the race dashboard URL)</span></label>
                  <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                    <input className="field" value={raceIdInput} onChange={e => setRaceIdInput(e.target.value)} placeholder="e.g. 98815" />
                    <button className="btn-primary" style={{ width: "auto", padding: "0 18px" }} onClick={saveRaceId}>Save</button>
                  </div>
                  {raceIdMsg && <div className={raceIdMsg.includes("Saved") ? "ok" : "err"} style={{ marginBottom: 12 }}>{raceIdMsg}</div>}
                  <button className="btn-ghost" disabled={raceSyncing} onClick={syncRaceNow}>{raceSyncing ? "Syncing…" : "Sync race registrations now"}</button>
                  {raceSyncMsg && <div className={raceSyncMsg.includes("Synced") ? "ok" : "err"} style={{ marginTop: 10 }}>{raceSyncMsg}</div>}
                </>
              )}
            </div>

            <div style={{ height: 1, background: "#1e1e1e", margin: "8px 0" }} />
            <div>
              <button onClick={() => setUsersExpanded(e => !e)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", marginBottom: usersExpanded ? 12 : 0 }}>
                <span className="label" style={{ marginBottom: 0 }}>USERS</span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "#6a6a6a" }}>{allRunners.length} people</span>
                  <span style={{ color: "#6a6a6a", fontSize: 12 }}>{usersExpanded ? "▴" : "▾"}</span>
                </span>
              </button>

              {usersExpanded && (
                <>
                  <input className="field" placeholder="Search all users" value={usersSearch} onChange={e => setUsersSearch(e.target.value)} style={{ marginBottom: 16 }} />
                  <div style={{ display: "flex", flexDirection: "column" }}>
                    {allRunners
                      .filter(r => !usersSearch.trim() || (r.first_name + " " + r.last_name + " " + r.email).toLowerCase().includes(usersSearch.trim().toLowerCase()))
                      .sort((a, b) => (a.first_name + a.last_name).localeCompare(b.first_name + b.last_name))
                      .map(r => (
                        <div key={r.id} style={{ padding: "12px 0", borderBottom: "1px solid #191919" }}>
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                            <div style={{ minWidth: 0 }}>
                              <div style={{ fontSize: 13, fontWeight: 800, color: "#fff" }}>{r.first_name} {r.last_name}</div>
                              {r.is_active_member && <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: ".05em", color: "#e52240" }}>MEMBER</div>}
                            </div>
                            <select value={pendingRoleChange?.runner.id === r.id ? pendingRoleChange.newRole : (r.app_role || "runner")} onChange={e => setPendingRoleChange({ runner: r, newRole: e.target.value })} style={{ background: "#121212", border: "1px solid " + (r.app_role === "admin" ? "#e52240" : "#2a2a2a"), color: r.app_role === "admin" ? "#e52240" : "#d4d4d4", fontSize: 11, fontWeight: 800, padding: "8px 10px", borderRadius: 4 }}>
                              <option value="runner">RUNNER</option>
                              <option value="pacer">PACER</option>
                              <option value="flight_crew">FLIGHT CREW</option>
                              <option value="captain">CAPTAIN</option>
                              <option value="admin">ADMIN</option>
                            </select>
                          </div>
                          {pendingRoleChange?.runner.id === r.id && (
                            <div style={{ marginTop: 10, border: "1px solid #e52240", background: "#1a0a0e", padding: 14, borderRadius: 2 }}>
                              <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Change {r.first_name} {r.last_name}'s role to {{ runner: "Runner", pacer: "Pacer", flight_crew: "Flight Crew", captain: "Captain", admin: "Admin" }[pendingRoleChange.newRole]}?</div>
                              <div style={{ fontSize: 12, fontWeight: 600, color: "#cc9999", lineHeight: 1.5, marginBottom: 14 }}>This changes what they can access right away.</div>
                              <div style={{ display: "flex", gap: 8 }}>
                                <button onClick={() => setUserRole(pendingRoleChange.runner, pendingRoleChange.newRole)} style={{ flex: 1, minHeight: 40, background: "#e52240", color: "#000", border: "none", fontSize: 11, fontWeight: 900, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>YES, CHANGE</button>
                                <button onClick={() => setPendingRoleChange(null)} style={{ flex: 1, minHeight: 40, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", fontSize: 11, fontWeight: 800, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>CANCEL</button>
                              </div>
                            </div>
                          )}
                        </div>
                      ))}
                  </div>
                  {usersMsg && <div className={usersMsg.includes("Updated") ? "ok" : "err"} style={{ marginTop: 12 }}>{usersMsg}</div>}
                </>
              )}
            </div>
          </div>
        )}

        <button onClick={signOut} style={{ background: "none", border: "none", color: "#6a6a6a", fontSize: 11, fontWeight: 800, letterSpacing: ".14em", textTransform: "uppercase", cursor: "pointer", padding: "24px 0 0", display: "block" }}>Sign out</button>
      </div>
      {renderBottomNav()}
      </>
    );
  }

  if (view === "kiosk") {
    const inSet = ev ? (checkinMap[ev.id] || new Set()) : new Set();
    const groupLabel = ev && ev.mileage ? "MILEAGE GROUP" : "PACE GROUP";
    const kioskShell = { maxWidth: 760, width: "100%", minHeight: "100vh", margin: "0 auto", display: "flex", flexDirection: "column" };

    if (kioskResult) {
      return (
        <div style={{ ...kioskShell, padding: 0 }}>
          <div style={{ background: "#e52240", color: "#000", padding: "48px 44px", display: "flex", alignItems: "center", gap: 28 }}>
            <div style={{ flex: "0 0 auto", width: 100, height: 100, borderRadius: "50%", overflow: "hidden", background: kioskResult.photo_url ? "transparent" : "rgba(0,0,0,.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {kioskResult.photo_url ? <img src={kioskResult.photo_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 34, fontWeight: 900, fontStyle: "italic" }}>{initials(kioskResult.first_name, kioskResult.last_name)}</span>}
            </div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: ".2em", marginBottom: 10 }}>{kioskResult.runs === 1 ? "FIRST RUN — WELCOME IN" : "CHECKED IN"}</div>
              <div style={{ fontSize: 48, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.92 }}>{kioskResult.first_name} {kioskResult.last_name}</div>
            </div>
          </div>
          <div style={{ padding: "40px 44px 60px", display: "flex", flexDirection: "column", gap: 34, flex: 1 }}>
            <div style={{ display: "flex", gap: 20 }}>
              <div style={{ flex: 1, borderTop: "2px solid #2a2a2a", paddingTop: 16 }}>
                <div style={{ fontSize: 42, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{kioskResult.runs}</div>
                <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 8 }}>RUNS</div>
              </div>
              <div style={{ flex: 1, borderTop: "2px solid #2a2a2a", paddingTop: 16 }}>
                <div style={{ fontSize: 42, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{kioskResult.streak}</div>
                <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 8 }}>WEEK STREAK</div>
              </div>
              <div style={{ flex: 1, borderTop: "2px solid #e52240", paddingTop: 16 }}>
                <div style={{ fontSize: 24, fontWeight: 900, fontStyle: "italic", lineHeight: 1.1, textTransform: "uppercase" }}>{ev && ev.mileage ? kioskResult.dist : kioskResult.pace}</div>
                <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 8 }}>{groupLabel}</div>
              </div>
            </div>
            <div style={{ fontSize: 18, fontWeight: 600, color: "#6a6a6a", lineHeight: 1.6 }}>{(() => { const next = MILESTONES.find(n => n > kioskResult.runs); return next ? "Next milestone at " + next + " runs." : "All milestones earned."; })()}</div>
          </div>
          <button onClick={() => { setKioskResult(null); signOut(); }} style={{ background: "none", border: "none", color: "#5a5a5a", fontSize: 13, fontWeight: 800, letterSpacing: ".16em", textTransform: "uppercase", cursor: "pointer", padding: "0 44px 36px", display: "block" }}>Sign out</button>
        </div>
      );
    }

    // idle, unlocked
    return (
      <div style={{ ...kioskShell, padding: "56px 44px", justifyContent: "center", alignItems: "center", textAlign: "center", gap: 32 }}>
        <img src={DRC_LOGO} alt="DRC" style={{ width: 68, height: "auto" }} />
        <div>
          <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: ".24em", color: "#e52240", marginBottom: 14 }}>{ev ? eventDateLabel(ev).toUpperCase() + " · " + ev.name.toUpperCase() : "NO EVENT SELECTED"}</div>
          {ev && ev.cancelled ? (
            <div style={{ fontSize: 44, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.98, color: "#ff8496" }}>This run is<br/>cancelled</div>
          ) : ev && ev.hold ? (
            <div style={{ fontSize: 44, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.98, color: "#f0dc9a" }}>Weather hold —<br/>expect delay</div>
          ) : (
            <div style={{ fontSize: 52, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.94 }}>Hold your<br/>pass up</div>
          )}
        </div>

        <div style={{ width: "100%", maxWidth: 420 }}><CameraScanner onDetect={kioskHandleScan} onClose={() => {}} /></div>

        <div style={{ fontSize: 17, fontWeight: 600, color: "#7a7a7a", lineHeight: 1.6 }}>{inSet.size} checked in · {ev ? ev.name : "—"}</div>
        <button onClick={signOut} style={{ background: "none", border: "none", color: "#5a5a5a", fontSize: 13, fontWeight: 800, letterSpacing: ".16em", textTransform: "uppercase", cursor: "pointer", padding: "12px 0" }}>Sign out</button>
      </div>
    );
  }

  return <div>Loading…</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
