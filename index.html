                            <select value={pendingRoleChange?.runner.id === r.id ? pendingRoleChange.newRole : (r.app_role || "runner")} onChange={e => setPendingRoleChange({ runner: r, newRole: e.target.value })} style={{ background: "#121212", border: "1px solid " + (r.app_role === "admin" ? "#e52240" : "#2a2a2a"), color: r.app_role === "admin" ? "#e52240" : "#d4d4d4", fontSize: 11, fontWeight: 800, padding: "8px 10px", borderRadius: 4 }}>
                              <option value="runner">RUNNER</option>
                              <option value="pacer">PACER</option>
                              <option value="flight_crew">FLIGHT CREW</option>
                              <option value="captain">CAPTAIN</option>
                              <option value="admin">ADMIN</option>
                            </select>
                          </div>

                          {expandedUserId === r.id && (
                            <div style={{ marginTop: 10, border: "1px solid #232323", padding: "4px 14px" }}>
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid #191919" }}>
                                <span style={{ fontSize: 11, fontWeight: 700, color: "#7a7a7a" }}>Email</span>
                                <span style={{ fontSize: 12, fontWeight: 700, color: "#fff", textAlign: "right" }}>{r.email}</span>
                              </div>
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid #191919" }}>
                                <span style={{ fontSize: 11, fontWeight: 700, color: "#7a7a7a" }}>Phone</span>
                                <span style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>{r.phone ? formatPhone(r.phone) : "—"}</span>
                              </div>
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid #191919" }}>
                                <span style={{ fontSize: 11, fontWeight: 700, color: "#7a7a7a" }}>Code</span>
                                <span style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>{r.code || "—"}</span>
                              </div>
                              <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 0" }}>
                                <span style={{ fontSize: 11, fontWeight: 700, color: "#7a7a7a" }}>Member since</span>
                                <span style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>{r.member_since ? new Date(r.member_since + "T00:00:00").getFullYear() : "—"}</span>
                              </div>
                              {(r.app_role || "runner") === "runner" && (
                                <button onClick={() => setPendingDeleteUser(r)} style={{ width: "100%", marginTop: 4, marginBottom: 12, minHeight: 36, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 900, letterSpacing: ".1em", background: "transparent", color: "#e52240", border: "1px solid #e52240" }}>DELETE USER</button>
                              )}
                            </div>
                          )}

                          {pendingDeleteUser?.id === r.id && (
                            <div style={{ marginTop: 10, border: "1px solid #e52240", background: "#1a0a0e", padding: 14, borderRadius: 2 }}>
                              <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Delete {r.first_name} {r.last_name}?</div>
                              <div style={{ fontSize: 12, fontWeight: 600, color: "#cc9999", lineHeight: 1.5, marginBottom: 14 }}>This permanently removes their account, pass, and history. This can't be undone.</div>
                              <div style={{ display: "flex", gap: 8 }}>
                                <button onClick={deleteUser} style={{ flex: 1, minHeight: 40, background: "#e52240", color: "#000", border: "none", fontSize: 11, fontWeight: 900, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>YES, DELETE</button>
                                <button onClick={() => setPendingDeleteUser(null)} style={{ flex: 1, minHeight: 40, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", fontSize: 11, fontWeight: 800, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>CANCEL</button>
                              </div>
                            </div>
                          )}

                          {pendingRoleChange?.runner.id === r.id && (
                            <div style={{ marginTop: 10, border: "1px solid #e52240", background: "#1a0a0e", padding: 14, borderRadius: 2 }}>
                              <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Change {r.first_name} {r.last_name}'s role to {{ runner: "Runner", pacer: "Pacer", flight_crew: "Flight Crew", captain: "Captain", admin: "Admin" }[pendingRoleChange.newRole]}?</div>
                              <div style={{ fontSize: 12, fontWeight: 600, color: "#cc9999", lineHeight: 1.5, marginBottom: 14 }}>This changes what they can access right away.</div>
                              <div style={{ display: "flex", gap: 8 }}>
                                <button onClick={() => setUserRole(pendingRoleChange.runner, pendingRoleChange.newRole)} style={{ flex: 1, minHeight: 40, background: "#e52240", color: "#000", border: "none", fontSize: 11, fontWeight: 900, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>YES, CHANGE</button>
                                <button onClick={() => setPendingRoleChange(null)} style={{ flex: 1, minHeight: 40, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", fontSize: 11, fontWeight: 800, letterSpacing: ".08em", borderRadius: 2, cursor: "pointer" }}>CANCEL</button>
                              </div>
                            </div>
                          )}
                        </div>
                      ))}
                  </div>
                  {usersMsg && <div className={usersMsg.includes("Updated") ? "ok" : "err"} style={{ marginTop: 12 }}>{usersMsg}</div>}
                </>
              )}
            </div>
          </div>
        )}

        <div style={{ height: 1, background: "#1e1e1e", margin: "20px 0 4px" }} />
        <button onClick={signOut} style={{ background: "none", border: "none", color: "#6a6a6a", fontSize: 11, fontWeight: 800, letterSpacing: ".14em", textTransform: "uppercase", cursor: "pointer", padding: "24px 0 0", display: "block" }}>Sign out</button>
      </div>
      {renderBottomNav()}
      </>
    );
  }

  if (view === "kiosk") {
    const inSet = ev ? (checkinMap[ev.id] || new Set()) : new Set();
    const groupLabel = ev && ev.mileage ? "MILEAGE GROUP" : "PACE GROUP";
    const kioskShell = { maxWidth: 760, width: "100%", minHeight: "100vh", margin: "0 auto", display: "flex", flexDirection: "column" };

    if (kioskResult) {
      return (
        <div style={{ ...kioskShell, padding: 0 }}>
          <div style={{ background: "#e52240", color: "#000", padding: "48px 44px", display: "flex", alignItems: "center", gap: 28 }}>
            <div style={{ flex: "0 0 auto", width: 100, height: 100, borderRadius: "50%", overflow: "hidden", background: kioskResult.photo_url ? "transparent" : "rgba(0,0,0,.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {kioskResult.photo_url ? <img src={kioskResult.photo_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 34, fontWeight: 900, fontStyle: "italic" }}>{initials(kioskResult.first_name, kioskResult.last_name)}</span>}
            </div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: ".2em", marginBottom: 10 }}>{kioskResult.runs === 1 ? "FIRST RUN — WELCOME IN" : "CHECKED IN"}</div>
              <div style={{ fontSize: 48, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.92 }}>{kioskResult.first_name} {kioskResult.last_name}</div>
            </div>
          </div>
          <div style={{ padding: "40px 44px 60px", display: "flex", flexDirection: "column", gap: 34, flex: 1 }}>
            <div style={{ display: "flex", gap: 20 }}>
              <div style={{ flex: 1, borderTop: "2px solid #2a2a2a", paddingTop: 16 }}>
                <div style={{ fontSize: 42, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{kioskResult.runs}</div>
                <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 8 }}>RUNS</div>
              </div>
              <div style={{ flex: 1, borderTop: "2px solid #2a2a2a", paddingTop: 16 }}>
                <div style={{ fontSize: 42, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{kioskResult.streak}</div>
                <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 8 }}>WEEK STREAK</div>
              </div>
              <div style={{ flex: 1, borderTop: "2px solid #e52240", paddingTop: 16 }}>
                <div style={{ fontSize: 24, fontWeight: 900, fontStyle: "italic", lineHeight: 1.1, textTransform: "uppercase" }}>{ev && ev.mileage ? kioskResult.dist : kioskResult.pace}</div>
                <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: ".12em", color: "#8a8a8a", marginTop: 8 }}>{groupLabel}</div>
              </div>
            </div>
            <div style={{ fontSize: 18, fontWeight: 600, color: "#6a6a6a", lineHeight: 1.6 }}>{(() => { const next = MILESTONES.find(n => n > kioskResult.runs); return next ? "Next milestone at " + next + " runs." : "All milestones earned."; })()}</div>
          </div>
          <button onClick={() => { setKioskResult(null); signOut(); }} style={{ background: "none", border: "none", color: "#5a5a5a", fontSize: 13, fontWeight: 800, letterSpacing: ".16em", textTransform: "uppercase", cursor: "pointer", padding: "0 44px 36px", display: "block" }}>Sign out</button>
        </div>
      );
    }

    // idle, unlocked
    return (
      <div style={{ ...kioskShell, padding: "56px 44px", justifyContent: "center", alignItems: "center", textAlign: "center", gap: 32 }}>
        <img src={DRC_LOGO} alt="DRC" style={{ width: 68, height: "auto" }} />
        <div>
          <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: ".24em", color: "#e52240", marginBottom: 14 }}>{ev ? eventDateLabel(ev).toUpperCase() + " · " + ev.name.toUpperCase() : "NO EVENT SELECTED"}</div>
          {ev && ev.cancelled ? (
            <div style={{ fontSize: 44, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.98, color: "#ff8496" }}>This run is<br/>cancelled</div>
          ) : ev && ev.hold ? (
            <div style={{ fontSize: 44, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.98, color: "#f0dc9a" }}>Weather hold —<br/>expect delay</div>
          ) : (
            <div style={{ fontSize: 52, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.94 }}>Hold your<br/>pass up</div>
          )}
        </div>

        <div style={{ width: "100%", maxWidth: 420 }}><CameraScanner onDetect={kioskHandleScan} onClose={() => {}} /></div>

        <div style={{ fontSize: 17, fontWeight: 600, color: "#7a7a7a", lineHeight: 1.6 }}>{inSet.size} checked in · {ev ? ev.name : "—"}</div>
        <button onClick={signOut} style={{ background: "none", border: "none", color: "#5a5a5a", fontSize: 13, fontWeight: 800, letterSpacing: ".16em", textTransform: "uppercase", cursor: "pointer", padding: "12px 0" }}>Sign out</button>
      </div>
    );
  }

  return <div>Loading…</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
