function isEmail(v) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); }
function isPhone(v) { return (v || "").replace(/\D/g, "").length >= 10; }
function genCode(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const chars = "ACDEFGHJKLMNPQRTUVWXY3456789";
  let out = "", v = h >>> 0;
  for (let i = 0; i < 8; i++) { out += chars[v % chars.length]; v = Math.floor(v / chars.length) + 7919; }
  return "DRC-" + out;
}

// ── Real scannable QR (encodes "DRC1:<code>") ─────────────
// Real scannable QR, rendered as an <img> from a QR-generation API —
// no JS library to load means no more CDN-path or CORS failures.
// Trade-off: the pass code is sent to api.qrserver.com's servers to
// render the image. The code is an opaque id, not personal data, but
// flagging it since it's a third-party network call either way.
function RealQr({ value, size = 180 }) {
  const src = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(value)}`;
  return <img src={src} alt="Member pass QR code" width={size} height={size} style={{ display: "block" }}
    onError={(e) => { e.target.style.display = "none"; e.target.nextSibling.style.display = "flex"; }} />;
}
function RealQrFallback({ value, size = 180 }) {
  return <div style={{ display: "none", width: size, height: size, alignItems: "center", justifyContent: "center", background: "#eee", color: "#333", fontSize: 11, fontWeight: 700, textAlign: "center", padding: 10 }}>QR unavailable — show this code instead: {value}</div>;
}

// ── Camera-based QR scanner (decodes via jsQR) ────────────
function CameraScanner({ onDetect, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const [scanErr, setScanErr] = useState("");

  useEffect(() => {
    let stream, raf, stopped = false;
    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        tick();
      } catch (e) {
        setScanErr("Camera unavailable. Check permissions, and that you're on HTTPS.");
      }
    }
    function tick() {
      if (stopped) return;
      const v = videoRef.current, c = canvasRef.current;
      if (v && v.readyState === v.HAVE_ENOUGH_DATA) {
        c.width = v.videoWidth; c.height = v.videoHeight;
        const ctx = c.getContext("2d");
        ctx.drawImage(v, 0, 0, c.width, c.height);
        const img = ctx.getImageData(0, 0, c.width, c.height);
        const result = jsQR(img.data, img.width, img.height);
        if (result && result.data) { onDetect(result.data); return; }
      }
      raf = requestAnimationFrame(tick);
    }
    start();
    return () => { stopped = true; cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); };
  }, [onDetect]);

  return (
    <div style={{ position: "relative", aspectRatio: "1", background: "#000", borderRadius: 4, overflow: "hidden" }}>
      <video ref={videoRef} muted playsInline style={{ width: "100%", height: "100%", objectFit: "cover" }} />
      <canvas ref={canvasRef} style={{ display: "none" }} />
      {scanErr && <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, textAlign: "center", fontSize: 13, color: "#ff8496", background: "rgba(0,0,0,.85)" }}>{scanErr}</div>}
      <button onClick={onClose} style={{ position: "absolute", top: 10, right: 10, width: 34, height: 34, borderRadius: "50%", background: "rgba(0,0,0,.6)", border: "none", color: "#fff", fontSize: 16, cursor: "pointer" }}>✕</button>
    </div>
  );
}

function App() {

  // The signed-in account's own app_role — 'runner' | 'pacer' |

  const [clubIdInput, setClubIdInput] = useState("");
  const [clubIdMsg, setClubIdMsg] = useState("");
  const [apiRegInput, setApiRegInput] = useState("");

  const [memberSinceEmail, setMemberSinceEmail] = useState("");

  const [eventForm, setEventForm] = useState({ name: "", event_date: "", event_time: "", event_end_time: "", location_id: "", notes: "", mileage: false, special: false, remind: true });

  async function refreshAll() {
    const [{ data: ev }, { data: rs }, { data: ci }, { data: runners }, { data: locs }] = await Promise.all([
      sb.from("events").select("*").order("created_at"),
      sb.from("rsvps").select("runner_id,event_id"),
      sb.from("checkins").select("runner_id,event_id"),
      sb.from("runners").select("*").order("created_at"),
      sb.from("locations").select("*").order("name"),
    ]);
    setEvents(ev || []);
    const rMap = {}; (rs || []).forEach(r => { (rMap[r.event_id] ||= new Set()).add(r.runner_id); });
    setRsvpMap(rMap);
    const cMap = {}; (ci || []).forEach(r => { (cMap[r.event_id] ||= new Set()).add(r.runner_id); });
    setCheckinMap(cMap);
    setAllRunners(runners || []);
    setLocations(locs || []);
    return runners || [];
  }

  useEffect(() => {
    refreshAll();
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  // Live cross-device updates: whenever runners, checkins, rsvps, events,
  // or locations change anywhere (any device, any session), refetch —
  // so a captain's phone sees a brand-new signup or check-in without
  // anyone needing to manually reload. Debounced so a burst of rapid
  // changes (several check-ins in a row) collapses into one refetch
  // instead of hammering the database.
  useEffect(() => {
    let debounceId = null;
    const debouncedRefresh = () => {
      clearTimeout(debounceId);
      debounceId = setTimeout(() => refreshAll(), 400);
    };
    const channel = sb.channel("drc-live-changes");
    ["runners", "checkins", "rsvps", "events", "locations"].forEach(table => {
      channel.on("postgres_changes", { event: "*", schema: "public", table }, debouncedRefresh);
    });
    channel.subscribe();
    return () => { clearTimeout(debounceId); sb.removeChannel(channel); };
  }, []);

  // Check RunSignUp connection status, and handle the message coming back
  // from the OAuth callback redirect (?runsignup=connected, etc.).
  useEffect(() => {
    sb.rpc("runsignup_connection_status").then(({ data }) => {
      setRunsignupStatus(data?.[0] || { connected: false, updated_at: null });
    });

    const params = new URLSearchParams(window.location.search);
    const result = params.get("runsignup");
    if (result) {
      const messages = {
        connected: "Connected to RunSignUp.",
        denied: "RunSignUp connection was cancelled or denied.",
        expired: "That connection attempt expired — try again.",
        tokenerror: "RunSignUp didn't return usable tokens — try again.",
        savefailed: "Connected, but saving the tokens failed — try again.",
      };
      setRunsignupMsg(messages[result] || "Something went wrong connecting RunSignUp.");
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);

  // Keep the signed-in runner's own record in sync with Realtime-driven
  // updates to allRunners — otherwise something like a membership sync
  // (which changes is_active_member on the Members tab's gate) wouldn't
  // show up until the next full sign-in.
  useEffect(() => {
    if (!me) return;
    const fresh = allRunners.find(r => r.id === me.id);
    if (fresh && JSON.stringify(fresh) !== JSON.stringify(me)) setMe(fresh);
  }, [allRunners]);

  // Same idea for role specifically — if an admin changes someone's
  // role while they're actively signed in, the extra nav tab should
  // reflect that without them needing to sign in again.
  useEffect(() => {
    if (me?.app_role) setRole(me.app_role);
  }, [me?.app_role]);

  useEffect(() => {
    if (!session) { setMe(null); return; }
    (async () => {
      const runners = await refreshAll();
      const mine = runners.find(r => r.auth_user_id === session.user.id);
      if (mine) { routeAfterSignIn(mine); return; }

      // Came from "Create my pass" — we already have their details saved
      // locally from before the magic-link round trip, so finish signup
      // automatically instead of asking them to re-enter everything.
      const pendingRaw = localStorage.getItem("drc_pending_signup");
      if (pendingRaw) {
        const pending = JSON.parse(pendingRaw);
        if (pending.email === session.user.email) {
          localStorage.removeItem("drc_pending_signup");
          const full = pending.firstName + " " + pending.lastName;
          const { data, error } = await sb.from("runners").insert({
            auth_user_id: session.user.id,
            first_name: pending.firstName,
            last_name: pending.lastName,
            email: session.user.email,
            phone: pending.phone,
            sms_opt_in: pending.smsOptIn,
            sms_opt_in_at: pending.smsOptIn ? new Date().toISOString() : null,
            pace: pending.pace,
            dist: "Long Distance",
            waiver_signed_at: new Date().toISOString(),
            code: genCode(full + session.user.email),
            joined_label: new Date().toLocaleDateString(undefined, { month: "short", year: "numeric" }).toUpperCase(),
          }).select().single();
          if (!error) {
            setAllRunners(r => r.concat([data]));
            routeAfterSignIn(data);
            return;
          }
          // fall through to manual completion if the auto-insert failed
        }
      }
      setNeedsProfile(true); setView("completeProfile");
    })();
  }, [session]);

  useEffect(() => {
    if (!me) { setMyHistory([]); setStravaLink(""); return; }
    setStravaLink(me.strava_url || "");
    (async () => {
      const { data } = await sb
        .from("checkins")
        .select("created_at, events(name)")
        .eq("runner_id", me.id)
        .order("created_at", { ascending: false })
        .limit(20);
      setMyHistory((data || []).map(row => ({
        name: row.events?.name || "Run",
        date: new Date(row.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      })));
    })();
  }, [me?.id]);

  const [qrSaving, setQrSaving] = useState(false);
  async function saveQrToPhotos() {
    if (!me) return;
    const value = "DRC1:" + me.code;
    const url = `https://api.qrserver.com/v1/create-qr-code/?size=512x512&data=${encodeURIComponent(value)}`;
    setQrSaving(true);
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], `drc-pass-${me.code}.png`, { type: "image/png" });
      if (typeof navigator.share === "function" && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "DRC Member Pass" }); }
        catch (e) { /* user cancelled the share sheet — not an error */ }
      } else {
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = objUrl; a.download = `drc-pass-${me.code}.png`;
        a.click();
        URL.revokeObjectURL(objUrl);
      }
    } catch (e) {
      // Couldn't read the image bytes (likely a CORS restriction on the
      // QR host) — fall back to just opening it, so a long-press/
      // right-click still saves it the normal OS way.
      window.open(url, "_blank");
    }
    setQrSaving(false);
  }

  // Draws the whole pass (avatar, name, QR, pace/Saturdays, member since
  // + code) onto an offscreen canvas and saves that as one image. Falls
  // back to saveQrToPhotos() if anything about the render fails — most
  // likely a CORS restriction on the QR image or (less likely) an
  // uploaded profile photo, either of which would otherwise silently
  // taint the whole canvas and block export entirely.
  async function savePassCard() {
    if (!me) return;
    setQrSaving(true);
    try {
      const SCALE = 2;
      const W = 340;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      await document.fonts.ready;

      const pad = 20;
      const r = 33;
      const qrSize = W - pad * 2 - 32;
      const H = pad + r * 2 + 18 + 14 + 14 + qrSize + 32 + 20 + 18 + 24 + 1 + 20 + 12 + pad;

      canvas.width = W * SCALE; canvas.height = H * SCALE;
      ctx.scale(SCALE, SCALE);

      ctx.fillStyle = "#0a0a0a";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#232323"; ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

      let y = pad;
      const cx = pad + r, cy = y + r;

      function drawInitialsAvatar() {
        ctx.fillStyle = "#1a1a1a";
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#e52240";
        ctx.font = "italic 900 22px Montserrat, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(initials(me.first_name, me.last_name), cx, cy + 1);
      }
      if (me.photo_url) {
        try {
          const img = await loadImage(me.photo_url);
          ctx.save();
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
          ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
          ctx.restore();
        } catch (e) { drawInitialsAvatar(); }
      } else {
        drawInitialsAvatar();
      }
      ctx.strokeStyle = "#e52240"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "italic 900 22px Montserrat, sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText((me.first_name + " " + me.last_name).toUpperCase(), cx + r + 14, cy);

      y = pad + r * 2 + 18;
      ctx.fillStyle = "#8a8a8a";
      ctx.font = "800 10px Montserrat, sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.fillText("SCAN AT ANY DRC RUN", pad, y);
      y += 28;

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize * 3}x${qrSize * 3}&data=${encodeURIComponent("DRC1:" + me.code)}`;
      const qrImg = await loadImage(qrUrl); // throws on CORS/network failure — caught below
      ctx.fillStyle = "#fff";
      ctx.fillRect(pad, y, W - pad * 2, qrSize + 32);
      ctx.drawImage(qrImg, pad + 16, y + 16, qrSize, qrSize);
      y += qrSize + 32 + 20;

      ctx.fillStyle = "#6a6a6a";
      ctx.font = "800 9px Montserrat, sans-serif";
      ctx.fillText("PACE GROUP", pad, y);
      ctx.fillText("SATURDAYS", pad + 150, y);
      y += 18;
      ctx.fillStyle = "#e52240";
      ctx.font = "700 13px Montserrat, sans-serif";
      ctx.fillText(me.pace.toUpperCase(), pad, y);
      ctx.fillText(me.dist.toUpperCase(), pad + 150, y);
      y += 24;

      ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
      y += 20;

      ctx.fillStyle = "#8a8a8a";
      ctx.font = "600 12px Montserrat, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("MEMBER SINCE " + me.joined_label, pad, y);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "right";
      ctx.fillText(me.code, W - pad, y);

      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error("toBlob failed")), "image/png"));
      const file = new File([blob], `drc-pass-${me.code}.png`, { type: "image/png" });
      if (typeof navigator.share === "function" && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "DRC Member Pass" }); }
        catch (e) { /* user cancelled the share sheet — not an error */ }
      } else {
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = objUrl; a.download = `drc-pass-${me.code}.png`;
        a.click();
        URL.revokeObjectURL(objUrl);
      }
      setQrSaving(false);
    } catch (e) {
      // Full-card render failed — fall back to the QR-only save, which
      // has its own three-tier fallback already.
      await saveQrToPhotos();
    }
  }

  async function uploadPhoto(file) {
    if (!me || !file) return;
    setPhotoUploading(true);
    const ext = file.name.split(".").pop();
    const path = `${session.user.id}/avatar.${ext}`;
    const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: true });
    if (!upErr) {
      const { data } = sb.storage.from("avatars").getPublicUrl(path);
      const photo_url = data.publicUrl + "?t=" + Date.now(); // cache-bust so the new photo shows immediately
      await sb.from("runners").update({ photo_url }).eq("id", me.id);
      setMe(m => ({ ...m, photo_url }));
      setAllRunners(rs => rs.map(r => r.id === me.id ? { ...r, photo_url } : r));
    }
    setPhotoUploading(false);
  }

  async function saveField(field, value) {
    setEditingField(null);
    if (!me || me[field] === value) return;
    setMe(m => ({ ...m, [field]: value }));
    setAllRunners(rs => rs.map(r => r.id === me.id ? { ...r, [field]: value } : r));
    await sb.from("runners").update({ [field]: value }).eq("id", me.id);
  }

  async function saveProfilePhone() {
    setEditProfileMsg("");
    if (!isPhone(editPhone)) return setEditProfileMsg("Add a phone number (10 digits).");
    setEditProfileSaving(true);
    const smsChanged = editSmsOptIn !== me.sms_opt_in;
    const patch = { phone: editPhone.trim(), sms_opt_in: editSmsOptIn };
    if (smsChanged) patch.sms_opt_in_at = editSmsOptIn ? new Date().toISOString() : null;
    const { error } = await sb.from("runners").update(patch).eq("id", me.id);
    setEditProfileSaving(false);
    if (error) return setEditProfileMsg("Something went wrong. Try again.");
    setMe(m => ({ ...m, ...patch }));
    setAllRunners(rs => rs.map(r => r.id === me.id ? { ...r, ...patch } : r));
    setEditingProfile(false);
  }

  async function saveStravaLink() {
    if (!me) return;
    await sb.from("runners").update({ strava_url: stravaLink.trim() }).eq("id", me.id);
    setMe(m => ({ ...m, strava_url: stravaLink.trim() }));
  }

  // Chronological order, used by the Runs tab, the admin Events list, and
  // the captain header — events without a real date (not yet edited since
  // the date/time migration) sort to the end rather than breaking the sort.
  const sortedEvents = useMemo(() => {
    return events.slice().sort((a, b) => {
      if (!a.event_date && !b.event_date) return 0;
      if (!a.event_date) return 1;
      if (!b.event_date) return -1;
      const aDt = new Date(a.event_date + "T" + (a.event_time ? a.event_time.slice(0, 5) : "00:00") + ":00");
      const bDt = new Date(b.event_date + "T" + (b.event_time ? b.event_time.slice(0, 5) : "00:00") + ":00");
      return aDt - bDt;
    });
  }, [events]);

  const ev = sortedEvents[eventIdx] || null;

  // The member Pass tab shows whatever event is actually coming up next
  // by real date/time — independent of whichever event a captain has
  // picked elsewhere (that's `ev`/eventIdx, a separate captain-only
  // concept for choosing which roster to manage).
  const nextEvent = useMemo(() => {
    const now = new Date();
    const upcoming = events
      .filter(x => !x.cancelled && x.event_date)
      .map(x => ({ ...x, _dt: new Date(x.event_date + "T" + (x.event_time ? x.event_time.slice(0, 5) : "00:00") + ":00") }))
      .filter(x => x._dt >= now)
      .sort((a, b) => a._dt - b._dt);
    return upcoming[0] || null;
  }, [events]);

  // An event the runner RSVP'd to that's happening right now — only
  // detectable for events with a real end time set, since without one
  // there's no reliable way to know when it's actually over. Separate
  // from nextEvent: once an event's start time has passed, it already
  // drops out of nextEvent's "upcoming" filter, so there's no overlap.
  const ongoingEvent = useMemo(() => {
    if (!me) return null;
    const now = new Date();
    return events.find(x => {
      if (x.cancelled || !x.event_date) return false;
      if (!rsvpMap[x.id]?.has(me.id)) return false;
      const start = new Date(x.event_date + "T" + (x.event_time ? x.event_time.slice(0, 5) : "00:00") + ":00");
      const endTime = x.event_end_time ? x.event_end_time.slice(0, 5) : "23:59";
      const end = new Date(x.event_date + "T" + endTime + ":00");
      return start <= now && now <= end;
    }) || null;
  }, [events, rsvpMap, me]);

  // Default to whichever event is currently happening or coming up next
  // (first non-past entry in chronological order), falling back to the
  // most recent past one if every event has already ended. Only runs
  // once on first load — after that, whatever the captain picks stays
  // picked even as Realtime keeps the event list fresh underneath. If
  // the picked event ever disappears (e.g. deleted), the index is
  // clamped back into range rather than pointing at nothing.
  const didAutoSelectEvent = useRef(false);
  const [eventPickerOpen, setEventPickerOpen] = useState(false);
  useEffect(() => {
    if (!sortedEvents.length) return;
    if (!didAutoSelectEvent.current) {
      didAutoSelectEvent.current = true;
      const idx = sortedEvents.findIndex(x => !eventIsPast(x));
      setEventIdx(idx !== -1 ? idx : sortedEvents.length - 1);
    } else if (eventIdx >= sortedEvents.length) {
      setEventIdx(sortedEvents.length - 1);
    }
  }, [sortedEvents]);

  // Waivers are valid 1 year from waiver_signed_at (matches the signup copy).
  const waiverExpiresAt = me?.waiver_signed_at ? new Date(new Date(me.waiver_signed_at).getTime() + 365 * 24 * 60 * 60 * 1000) : null;
  const waiverDaysLeft = waiverExpiresAt ? Math.ceil((waiverExpiresAt - new Date()) / 86400000) : null;
  const waiverExpired = waiverDaysLeft !== null && waiverDaysLeft <= 0;
  const waiverWarning = waiverDaysLeft !== null && waiverDaysLeft > 0 && waiverDaysLeft <= 7;

  async function submitResign() {
    setResignError("");
    if (!resignChecked) return setResignError("You'll need to agree to the waiver to keep running with us.");
    setResignLoading(true);
    const signedAt = new Date().toISOString();
    const { error } = await sb.from("runners").update({ waiver_signed_at: signedAt, waiver_reminder_sent_at: null }).eq("id", me.id);
    setResignLoading(false);
    if (error) return setResignError("Something went wrong. Try again.");
    setMe(m => ({ ...m, waiver_signed_at: signedAt, waiver_reminder_sent_at: null }));
    setResigning(false); setResignChecked(false); setWaiverBannerDismissed(false);
  }

  function renderResignForm(cancellable) {
    return (
      <div style={{ textAlign: cancellable ? "left" : "center" }}>
        {!cancellable && <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#e52240", marginBottom: 10 }}>WAIVER EXPIRED</div>}
        {!cancellable && <div style={{ fontSize: 20, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", color: "#fff", lineHeight: 1.05, marginBottom: 10 }}>Resign to keep running with us</div>}
        {!cancellable && <div style={{ fontSize: 12, fontWeight: 600, color: "#8a8a8a", lineHeight: 1.6, marginBottom: 18 }}>Your waiver expired. You'll need to agree again before you can check in or RSVP.</div>}
        <button onClick={() => setResignChecked(c => !c)} style={{ display: "flex", gap: 12, alignItems: "center", minHeight: 52, width: "100%", padding: "10px 14px", cursor: "pointer", borderRadius: 4, background: "#121212", border: "1px solid " + (resignChecked ? "#e52240" : "#2a2a2a"), color: "#d4d4d4", textAlign: "left", marginBottom: 10 }}>
          <span style={{ flex: "0 0 22px", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 900, background: resignChecked ? "#e52240" : "transparent", border: "2px solid " + (resignChecked ? "#e52240" : "#3a3a3a"), color: "#000" }}>{resignChecked ? "✓" : ""}</span>

        <button className="btn-primary" disabled={resignLoading} onClick={submitResign}>{resignLoading ? "Saving…" : "Resign and continue"}</button>
        {cancellable && <button onClick={() => { setResigning(false); setResignChecked(false); setResignError(""); }} style={{ width: "100%", marginTop: 10, minHeight: 40, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", borderRadius: 4, fontSize: 12, fontWeight: 700, textTransform: "uppercase", cursor: "pointer" }}>Cancel</button>}

  // ── Auth ─────────────────────────────────────────────────
  async function requestMagicLink(email) {
    setLoading(true);
    const { error } = await sb.auth.signInWithOtp({ email: email.trim().toLowerCase(), options: { emailRedirectTo: window.location.origin } });
    setLoading(false);
    return error;
  }

  async function sendMagicLink() {
    setAuthErr("");
    if (!isEmail(authEmail)) return setAuthErr("That email doesn't look right.");
    const error = await requestMagicLink(authEmail);
    if (error) return setAuthErr(error.status === 429 ? "Too many attempts — wait a few minutes and try again." : "Couldn't send the link. Try again in a minute.");
    setAuthSent(true);
  }

  async function submitSignup() {
    setError("");
    if (!form.firstName.trim()) return setError("Add your first name.");
    if (!form.lastName.trim()) return setError("Add your last name too.");
    if (!isEmail(form.email)) return setError("That email doesn't look right.");
    if (!isPhone(form.phone)) return setError("Add a phone number (10 digits).");
    if (!form.pace) return setError("Pick a pace group.");
    if (!form.waiver) return setError("You'll need to agree to the waiver to run with us.");
    const email = form.email.trim().toLowerCase();
    localStorage.setItem("drc_pending_signup", JSON.stringify({ email, firstName: form.firstName.trim(), lastName: form.lastName.trim(), phone: form.phone.trim(), smsOptIn: form.smsOptIn, pace: form.pace }));
    const error = await requestMagicLink(email);
    if (error) return setError(error.status === 429 ? "Too many attempts — wait a few minutes and try again." : "Couldn't send the link. Try again in a minute.");
    setAuthSent(true);
  }

  async function completeProfile() {
    setError("");
    if (!form.firstName.trim()) return setError("Add your first name.");
    if (!form.lastName.trim()) return setError("Add your last name too.");
    if (!isPhone(form.phone)) return setError("Add a phone number (10 digits).");
    if (!form.pace) return setError("Pick a pace group.");
    if (!form.waiver) return setError("You'll need to agree to the waiver to run with us.");
    setLoading(true);
    const full = form.firstName.trim() + " " + form.lastName.trim();
    const { data, error } = await sb.from("runners").insert({
      auth_user_id: session.user.id,
      first_name: form.firstName.trim(),
      last_name: form.lastName.trim(),
      email: session.user.email,
      phone: form.phone.trim(),
      sms_opt_in: form.smsOptIn,
      sms_opt_in_at: form.smsOptIn ? new Date().toISOString() : null,
      pace: form.pace,
      dist: "Long Distance",
      waiver_signed_at: new Date().toISOString(),
      code: genCode(full + session.user.email),
      joined_label: new Date().toLocaleDateString(undefined, { month: "short", year: "numeric" }).toUpperCase(),
    }).select().single();
    setLoading(false);
    if (error) return setError("Something went wrong creating your pass. Try again.");
    setMe(data);
    setAllRunners(r => r.concat([data]));
    setView("member"); setTab("pass"); setNeedsProfile(false);
  }

  async function signOut() {
    await sb.auth.signOut();
    setMe(null); setSession(null); setRole(null); setView("landing"); setLandingStep("welcome"); setAuthSent(false); setAuthEmail("");
  }

  // The one place that decides what someone sees right after signing
  // in. Everyone always lands on their own Pass now — a role just adds
  // an extra tab to the bottom nav rather than routing anywhere special.
  function routeAfterSignIn(runner) {
    setMe(runner);
    setRole(runner.app_role || "runner");
    setView("member"); setTab("pass");
    sb.from("race_registrations").select("*").then(({ data }) => setMyRaceRegs(data || []));
  }

  // Shared bottom nav — used by both the member view and the captain/
  // admin portal, so navigation stays in one place no matter where
  // someone is in the app. The role tab (Check-in/Admin) highlights
  // when actually inside that portal; the rest highlight only while on
  // the member view, and switch back to it when tapped from elsewhere.
  function renderBottomNav() {
    const hasPortalAccess = role === "captain" || role === "flight_crew" || role === "admin";
    const baseTabs = me.is_active_member
      ? (hasPortalAccess ? ["pass","runs","profile","members"] : ["pass","profile","runs","members"])
      : ["pass","profile","runs"];
    return (
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 440, margin: "0 auto", display: "flex", borderTop: "1px solid #1e1e1e", background: "#000" }}>
        {baseTabs.map(t => {
          const active = view === "member" && tab === t;
          return (
            <button key={t} onClick={() => { switchTab(t); setEditingField(null); setView("member"); }} style={{ flex: 1, minHeight: 56, background: active ? "#e52240" : "transparent", border: "none", color: active ? "#000" : (t === "profile" ? "#fff" : "#5a5a5a"), fontSize: 11, fontWeight: 900, letterSpacing: ".16em", cursor: "pointer" }}>{t.toUpperCase()}</button>
          );
        })}
        {hasPortalAccess && (
          <button onClick={() => setView("captain")} style={{ flex: 1, minHeight: 56, background: view === "captain" ? "#e52240" : "transparent", border: "none", color: view === "captain" ? "#000" : "#e52240", fontSize: 11, fontWeight: 900, letterSpacing: ".16em", cursor: "pointer" }}>{role === "admin" ? "ADMIN" : "CHECK-IN"}</button>
        )}
      </div>
    );
  }

  // ── Captain / admin gate ──────────────────────────────────
  function switchTab(t) { setTab(t); localStorage.setItem("drc_last_tab", t); }
  function switchCaptainTab(t) { setCaptainTab(t); localStorage.setItem("drc_last_captain_tab", t); }
  const [manualRefreshing, setManualRefreshing] = useState(false);
  async function manualRefresh() {
    setManualRefreshing(true);
    await refreshAll();
    setManualRefreshing(false);
  }

  async function checkIn(runnerId, eventId) {
    setCheckinMap(m => { const s = new Set(m[eventId] || []); s.add(runnerId); return { ...m, [eventId]: s }; });
    setAllRunners(rs => rs.map(r => r.id === runnerId ? { ...r, runs: r.runs + 1 } : r));
    const { error } = await sb.rpc("captain_check_in", { p_runner_id: runnerId, p_event_id: eventId });
    if (error) refreshAll();
  }
  async function undoCheckIn(runnerId, eventId) {
    setCheckinMap(m => { const s = new Set(m[eventId] || []); s.delete(runnerId); return { ...m, [eventId]: s }; });
    await sb.rpc("captain_undo_check_in", { p_runner_id: runnerId, p_event_id: eventId });
  }
  async function addGuestAndCheckIn() {
    const name = guestName.trim();
    if (!name || !ev) return;
    const { data: newId, error } = await sb.rpc("captain_add_guest", { p_name: name });
    if (error) return;
    await refreshAll();
    setGuestName(""); setShowGuestForm(false);
    checkIn(newId, ev.id);
  }
  async function toggleRsvp(eventId) {
    if (!me) return;
    const has = rsvpMap[eventId]?.has(me.id);
    setRsvpMap(m => { const s = new Set(m[eventId] || []); has ? s.delete(me.id) : s.add(me.id); return { ...m, [eventId]: s }; });
    if (has) await sb.from("rsvps").delete().eq("runner_id", me.id).eq("event_id", eventId);
    else await sb.from("rsvps").insert({ runner_id: me.id, event_id: eventId });
  }

  function handleScan(text) {
    setScanning(false);
    const m = /^DRC1:(.+)$/.exec(text.trim());
    const code = m ? m[1] : text.trim();
    const found = allRunners.find(r => r.code === code);
    if (!found) { setScanMsg("No member matches that code."); return; }
    setScanResult(found); setScanMsg("");
  }
  function confirmScan() {
    if (scanResult && ev) checkIn(scanResult.id, ev.id);
    setScanResult(null);
  }

  function setEventField(patch) {
    setEventForm(f => ({ ...f, ...patch }));
  }
  function newEventForm() {
    setEditingEventId(null);
    setEventForm({ name: "", event_date: "", event_time: "", event_end_time: "", location_id: "", notes: "", mileage: false, special: false, remind: true });
    setAddingLocation(false);
  }
  function loadEventForm(x) {
    setEditingEventId(x.id);
    setEventForm({ name: x.name, event_date: x.event_date || "", event_time: x.event_time ? x.event_time.slice(0, 5) : "", event_end_time: x.event_end_time ? x.event_end_time.slice(0, 5) : "", location_id: x.location_id || "", notes: x.notes || "", mileage: x.mileage, special: x.special, remind: x.remind });
    setAddingLocation(false);
  }
  async function saveEventForm() {
    setEventSaveMsg("");
    const id = editingEventId || (eventForm.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) + "-" + Date.now().toString(36));
    const { error } = await sb.rpc("admin_save_event", {
      p_id: id, p_name: eventForm.name,
      p_event_date: eventForm.event_date || null, p_event_time: eventForm.event_time || null,
      p_event_end_time: eventForm.event_end_time || null,
      p_location_id: eventForm.location_id || null, p_notes: eventForm.notes,
      p_mileage: eventForm.mileage, p_special: eventForm.special, p_remind: eventForm.remind,
    });
    if (error) return setEventSaveMsg("Couldn't save — check you're using the current admin code.");
    await refreshAll();
    newEventForm();
    setEventSaveMsg("Saved.");
  }
  async function addLocation() {
    if (!newLocationName.trim() || !newLocationAddress.trim()) return;
    const { data: newId, error } = await sb.rpc("admin_add_location", { p_name: newLocationName.trim(), p_address: newLocationAddress.trim() });
    if (error) return;
    await refreshAll();
    setEventField({ location_id: newId });
    setNewLocationName(""); setNewLocationAddress(""); setAddingLocation(false);
  }
  async function deleteEvent(id) {
    setDeleteConfirmId(null);
    await sb.rpc("admin_delete_event", { p_event_id: id });
    refreshAll();
  }
  async function toggleEventCancel(id) {
    await sb.rpc("admin_toggle_event_flag", { p_event_id: id, p_flag: "cancelled" });
    refreshAll();
  }
  async function toggleEventHold(id) {
    await sb.rpc("admin_toggle_event_flag", { p_event_id: id, p_flag: "hold" });
    refreshAll();
  }

  function kioskHandleScan(text) {
    const m = /^DRC1:(.+)$/.exec(text.trim());
    const code = m ? m[1] : text.trim();
    const found = allRunners.find(r => r.code === code);
    if (!found || !ev) return;
    checkIn(found.id, ev.id);
    setKioskResult({ ...found, runs: found.runs + 1 });
    setTimeout(() => setKioskResult(null), 6000);
  }

  function exportCsv() {
    if (!ev) return;
    const inSet = checkinMap[ev.id] || new Set();
    const rsvpSet = rsvpMap[ev.id] || new Set();
    const rows = [["Event", "Date", "First name", "Last name", "Email", "Pace", "RSVP'd", "Checked in"]]
      .concat(allRunners.map(r => [ev.name, eventDateLabel(ev), r.first_name, r.last_name, r.email, r.pace, rsvpSet.has(r.id) ? "yes" : "no", inSet.has(r.id) ? "yes" : "no"]));
    const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "drc-" + ev.id + "-checkins.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

    setClubIdMsg("");
    if (!clubIdInput.trim()) return setClubIdMsg("Enter a club ID.");
    const { error } = await sb.rpc("admin_set_club_id", { p_club_id: clubIdInput.trim() });
    if (error) return setClubIdMsg("Couldn't save — check you're using the current admin code.");
    setClubIdMsg("Saved.");
  }

    setApiRegMsg("Saved.");

  async function syncRaceNow() {
    setRaceSyncMsg("");
    setRaceSyncing(true);
    const { data, error } = await sb.functions.invoke("runsignup-race-sync");
    setRaceSyncing(false);
    if (error) return setRaceSyncMsg("Sync failed — check the race ID and RunSignUp setup, then try again.");
    if (data?.error) return setRaceSyncMsg("Issue: " + data.error);
    setRaceSyncMsg(`Synced — matched ${data.matched} of ${data.totalParticipants} registrants.`);

  async function saveMemberSince() {
    setMemberSinceMsg("");
    if (!isEmail(memberSinceEmail)) return setMemberSinceMsg("Enter a valid email.");
    if (!memberSinceDate) return setMemberSinceMsg("Pick a date.");
    const { error } = await sb.rpc("admin_set_member_since", { p_email: memberSinceEmail.trim(), p_date: memberSinceDate });
    if (error) return setMemberSinceMsg("Couldn't save — check the email matches a runner and you're using the current admin code.");

    setMemberSinceMsg("Saved. The sync won't overwrite this going forward.");
    setMemberSinceEmail(""); setMemberSinceDate("");

    setUsersMsg("");
    const { error } = await sb.rpc("admin_set_app_role", { p_runner_id: runner.id, p_role: role });
    setPendingRoleChange(null);
    if (error) return setUsersMsg("Couldn't update — try again.");
    setAllRunners(rs => rs.map(r => r.id === runner.id ? { ...r, app_role: role } : r));
    setUsersMsg("Updated.");
  }

  async function startMembershipSync() {
    setMembershipSyncMsg("");
    setMembershipSyncing(true);
    const { error } = await sb.rpc("admin_start_membership_sync", {});
    if (error) {
      setMembershipSyncing(false);
      return setMembershipSyncMsg("Couldn't start — check you're using the current admin code and that a club ID and API Caller Reg token are set.");
    }
    setMembershipSyncMsg("Started — checking automatically in 30 seconds. You can also tap Check now sooner if you like.");
    setTimeout(checkMembershipSync, 30000);
  }

  async function checkMembershipSync() {
    setMembershipSyncMsg("Checking…");
    const { error } = await sb.rpc("sync_runsignup_membership_check");
    if (error) {
      setMembershipSyncing(false);
      return setMembershipSyncMsg("Couldn't check — try again.");
    }
    const { data } = await sb.rpc("get_membership_sync_status");
    const s = data?.[0];
    if (!s) { setMembershipSyncing(false); return setMembershipSyncMsg("Checked, but no status came back."); }
    if (s.pending_sync_request_id) {
      setMembershipSyncMsg("Still waiting on RunSignUp — checking again in 15 seconds.");
      setTimeout(checkMembershipSync, 15000);
      return;
    }
    setMembershipSyncing(false);
    await refreshAll();
    if (s.last_sync_error) {
      setMembershipSyncMsg("Issue: " + s.last_sync_error + (s.last_sync_raw_sample ? " — sample record: " + JSON.stringify(s.last_sync_raw_sample) : ""));
    } else {
      setMembershipSyncMsg("Sync done — matched " + s.last_sync_matched + " runner" + (s.last_sync_matched === 1 ? "" : "s") + " to active memberships.");
    }
  }

  async function recalcStreaksNow() {
    setRecalculating(true); setStreakMsg("");
    const { error } = await sb.rpc("admin_recalculate_streaks", {});
    setRecalculating(false);

    setStreakMsg("Streaks recalculated from check-in history.");

                <button onClick={() => setForm(f => ({ ...f, waiver: !f.waiver }))} style={{ display: "flex", gap: 12, alignItems: "center", minHeight: 52, padding: "10px 14px", cursor: "pointer", borderRadius: 4, background: "#121212", border: "1px solid " + (form.waiver ? "#e52240" : "#2a2a2a"), color: "#d4d4d4", textAlign: "left" }}>
                  <span style={{ flex: "0 0 22px", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 900, background: form.waiver ? "#e52240" : "transparent", border: "2px solid " + (form.waiver ? "#e52240" : "#3a3a3a"), color: "#000" }}>{form.waiver ? "✓" : ""}</span>
                  <span style={{ fontSize: 12, fontWeight: 600 }}>I agree to the waiver, terms and Code of Conduct</span>
                </button>
                <a href="/waiver.html" target="_blank" rel="noopener" style={{ fontSize: 11, fontWeight: 700, color: "#e52240", textDecoration: "underline", marginTop: -6 }}>Read the waiver</a>
                {error && <div className="err">{error}</div>}
                <button className="btn-primary" disabled={loading} onClick={submitSignup}>{loading ? "Sending…" : "Create my pass"}</button>
                <div style={{ fontSize: 11, fontWeight: 500, color: "#5a5a5a", lineHeight: 1.5 }}>Waivers are valid one year from signup. We'll email you before yours expires.</div>
              </div>
            </>
          )}
        </div>
      );
    }
    return (
      <div className="app-shell" style={{ padding: "40px 22px", justifyContent: "center", gap: 24 }}>
        <button onClick={() => { setLandingStep("welcome"); setAuthSent(false); setAuthErr(""); }} style={{ alignSelf: "flex-start", background: "none", border: "none", color: "#6a6a6a", fontSize: 11, fontWeight: 800, letterSpacing: ".14em", textTransform: "uppercase", cursor: "pointer", padding: 0 }}>← Back</button>
        <div style={{ textAlign: "center" }}>
          <h2 style={{ margin: "0 0 8px", fontSize: 26, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase" }}>Access my pass</h2>
          <p style={{ margin: 0, fontSize: 13, fontWeight: 600, color: "#8a8a8a", lineHeight: 1.6 }}>Enter your email — we'll send a sign-in link. New here? Same field creates your pass.</p>
        </div>
        {!authSent ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <input className="field" type="email" placeholder="you@email.com" value={authEmail} onChange={e => setAuthEmail(e.target.value)} />
            {authErr && <div className="err">{authErr}</div>}
            <button className="btn-primary" disabled={loading} onClick={sendMagicLink}>{loading ? "Sending…" : "Email me a sign-in link"}</button>
          </div>
        ) : (
          <div className="ok">Check your email for a sign-in link — it'll bring you right back here.</div>
        )}
      </div>
    );
  }

  // ── Complete profile (first sign-in after clicking magic link) ──
  if (view === "completeProfile" && needsProfile) {
    return (
      <div className="app-shell" style={{ padding: "28px 22px 40px" }}>
        <h2 style={{ margin: "0 0 6px", fontSize: 28, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase" }}>Make your pass</h2>
        <p style={{ margin: "0 0 22px", fontSize: 13, fontWeight: 600, color: "#8a8a8a" }}>You're signed in as {session.user.email}. Just need a few details.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <label className="label">FIRST NAME</label>
              <input className="field" value={form.firstName} onChange={e => setForm(f => ({ ...f, firstName: e.target.value }))} />
            </div>
            <div style={{ flex: 1 }}>
              <label className="label">LAST NAME</label>
              <input className="field" value={form.lastName} onChange={e => setForm(f => ({ ...f, lastName: e.target.value }))} />
            </div>
          </div>
          <div>
            <label className="label">PHONE NUMBER</label>
            <input className="field" type="tel" value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} placeholder="(202) 555-0100" />
          </div>
          <button onClick={() => setForm(f => ({ ...f, smsOptIn: !f.smsOptIn }))} style={{ display: "flex", gap: 12, alignItems: "center", minHeight: 48, padding: "10px 14px", cursor: "pointer", borderRadius: 4, background: "#121212", border: "1px solid " + (form.smsOptIn ? "#e52240" : "#2a2a2a"), color: "#d4d4d4", textAlign: "left" }}>
            <span style={{ flex: "0 0 20px", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 900, background: form.smsOptIn ? "#e52240" : "transparent", border: "2px solid " + (form.smsOptIn ? "#e52240" : "#3a3a3a"), color: "#000" }}>{form.smsOptIn ? "✓" : ""}</span>
            <span style={{ fontSize: 12, fontWeight: 600 }}>Text me reminders and updates <span style={{ color: "#6a6a6a" }}>(optional)</span></span>
          </button>
          <div>
            <label className="label">PACE GROUP</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {PACES.map(p => (
                <button key={p} onClick={() => setForm(f => ({ ...f, pace: p }))} style={{ display: "flex", justifyContent: "space-between", width: "100%", minHeight: 48, padding: "0 14px", cursor: "pointer", borderRadius: 4, textAlign: "left", fontSize: 14, fontWeight: 800, textTransform: "uppercase", background: form.pace === p ? "#1a0a0e" : "#121212", border: "1px solid " + (form.pace === p ? "#e52240" : "#2a2a2a"), color: "#fff", alignItems: "center" }}>
                  <span>{p}</span><span style={{ opacity: .7 }}>{PACE_TIMES[p]}</span>
                </button>
              ))}
            </div>
          </div>
          <button onClick={() => setForm(f => ({ ...f, waiver: !f.waiver }))} style={{ display: "flex", gap: 12, alignItems: "center", minHeight: 52, padding: "10px 14px", cursor: "pointer", borderRadius: 4, background: "#121212", border: "1px solid " + (form.waiver ? "#e52240" : "#2a2a2a"), color: "#d4d4d4", textAlign: "left" }}>
            <span style={{ flex: "0 0 22px", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 900, background: form.waiver ? "#e52240" : "transparent", border: "2px solid " + (form.waiver ? "#e52240" : "#3a3a3a"), color: "#000" }}>{form.waiver ? "✓" : ""}</span>
            <span style={{ fontSize: 12, fontWeight: 600 }}>I agree to the waiver, terms and Code of Conduct</span>
          </button>
          <a href="/waiver.html" target="_blank" rel="noopener" style={{ fontSize: 11, fontWeight: 700, color: "#e52240", textDecoration: "underline", marginTop: -6 }}>Read the waiver</a>
          {error && <div className="err">{error}</div>}
          <button className="btn-primary" disabled={loading} onClick={completeProfile}>{loading ? "Creating…" : "Create my pass"}</button>
        </div>
      </div>
    );
  }

  // ── Member ───────────────────────────────────────────────
  if (view === "member" && me) {
    const myRsvp = nextEvent && rsvpMap[nextEvent.id]?.has(me.id);
    const myCheckedIn = nextEvent && checkinMap[nextEvent.id]?.has(me.id);

    // Expired waiver blocks the whole app — no tabs, no nav, nothing
    // reachable until they resign.
    if (waiverExpired) {
      return (
        <div className="app-shell" style={{ padding: "40px 22px", justifyContent: "center" }}>
          {renderResignForm(false)}
        </div>
      );
    }

    return (
      <div className="app-shell" style={{ padding: "24px 20px 90px" }}>
        {tab === "pass" && (
          <>
            {resigning ? (
              <div className="card">{renderResignForm(true)}</div>
            ) : (
              <>
                {waiverWarning && !waiverBannerDismissed && (
                  <div style={{ border: "1px solid #e52240", background: "#1a0a0e", padding: "14px 16px", marginBottom: 18, position: "relative" }}>
                    <button onClick={() => setWaiverBannerDismissed(true)} aria-label="Dismiss" style={{ position: "absolute", top: 10, right: 10, background: "none", border: "none", color: "#8a8a8a", fontSize: 16, cursor: "pointer", padding: 4 }}>×</button>
                    <div style={{ fontSize: 13, fontWeight: 800, color: "#fff", marginBottom: 6, paddingRight: 20 }}>Your waiver expires in {waiverDaysLeft} day{waiverDaysLeft === 1 ? "" : "s"}</div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: "#cc9999", lineHeight: 1.5, marginBottom: 12 }}>Resign now so you don't lose access to your pass.</div>
                    <button onClick={() => setResigning(true)} style={{ minHeight: 38, padding: "0 18px", background: "#e52240", color: "#000", border: "none", fontSize: 11, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", letterSpacing: ".05em", borderRadius: 4, cursor: "pointer" }}>Resign waiver</button>
                  </div>
                )}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 22 }}>
              <img src={DRC_LOGO} alt="DRC" style={{ width: 30, height: "auto", display: "block" }} />
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#e52240" }}>{myCheckedIn ? "ON TODAY'S ROSTER" : (role === "captain" ? "CAPTAIN" : role === "flight_crew" ? "FLIGHT CREW" : role === "pacer" ? "PACER" : (me.is_active_member ? "MEMBER PASS" : "PASS"))}</div>
            </div>
            <div className="card">
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
                <div style={{ position: "relative", flex: "0 0 auto", width: 66, height: 66, borderRadius: "50%", overflow: "hidden", background: "#1a1a1a", border: "2px solid #e52240", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {me.photo_url ? (
                    <img src={me.photo_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  ) : (
                    <span style={{ fontSize: 22, fontWeight: 900, fontStyle: "italic", color: "#e52240" }}>{initials(me.first_name, me.last_name)}</span>
                  )}
                </div>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 22, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 1.03, marginBottom: 6 }}>{me.first_name} {me.last_name}</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a" }}>SCAN AT ANY DRC RUN</div>
                <button onClick={savePassCard} disabled={qrSaving} style={{ background: "none", border: "none", color: "#e52240", fontSize: 10, fontWeight: 800, letterSpacing: ".06em", textTransform: "uppercase", cursor: "pointer", padding: 0 }}>{qrSaving ? "Saving…" : "↓ Save"}</button>
              </div>
              <div style={{ background: "#fff", padding: 16, display: "flex", justifyContent: "center", marginBottom: 18 }}>
                <RealQr value={"DRC1:" + me.code} />
                <RealQrFallback value={"DRC1:" + me.code} />
              </div>
              <div style={{ display: "flex", gap: 24 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".16em", color: "#6a6a6a", marginBottom: 5 }}>PACE GROUP</div>
                  <button onClick={() => setEditingField(editingField === "pace" ? null : "pace")} style={{ background: "none", border: "none", padding: 0, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#e52240", letterSpacing: ".08em", textTransform: "uppercase" }}>{me.pace}</span>
                    <span style={{ fontSize: 11, color: "#6a6a6a" }}>✎</span>
                  </button>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".16em", color: "#6a6a6a", marginBottom: 5 }}>SATURDAYS</div>
                  <button onClick={() => setEditingField(editingField === "dist" ? null : "dist")} style={{ background: "none", border: "none", padding: 0, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: "#e52240", letterSpacing: ".08em", textTransform: "uppercase" }}>{me.dist}</span>
                    <span style={{ fontSize: 11, color: "#6a6a6a" }}>✎</span>
                  </button>
                </div>
              </div>

              {editingField === "pace" && (
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".16em", color: "#6a6a6a", marginBottom: 10 }}>CHANGE PACE GROUP</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 7, marginBottom: 12 }}>
                    {PACES.map(p => (
                      <button key={p} onClick={() => saveField("pace", p)} style={{ display: "flex", justifyContent: "space-between", minHeight: 42, padding: "0 12px", borderRadius: 4, textAlign: "left", fontSize: 13, fontWeight: 800, textTransform: "uppercase", background: me.pace === p ? "#1a0a0e" : "#121212", border: "1px solid " + (me.pace === p ? "#e52240" : "#2a2a2a"), color: "#fff", alignItems: "center", cursor: "pointer" }}>
                        <span>{p}</span><span style={{ opacity: .6 }}>{PACE_TIMES[p]}</span>
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setEditingField(null)} style={{ minHeight: 36, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", borderRadius: 4, fontSize: 11, fontWeight: 700, textTransform: "uppercase", cursor: "pointer", width: "100%" }}>Cancel</button>
                </div>
              )}
              {editingField === "dist" && (
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".16em", color: "#6a6a6a", marginBottom: 10 }}>CHANGE SATURDAY DISTANCE</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 7, marginBottom: 12 }}>
                    {DISTANCES.map(d => (
                      <button key={d} onClick={() => saveField("dist", d)} style={{ display: "flex", minHeight: 42, padding: "0 12px", borderRadius: 4, textAlign: "left", fontSize: 13, fontWeight: 800, textTransform: "uppercase", background: me.dist === d ? "#1a0a0e" : "#121212", border: "1px solid " + (me.dist === d ? "#e52240" : "#2a2a2a"), color: "#fff", alignItems: "center", cursor: "pointer" }}>{d}</button>
                    ))}
                  </div>
                  <button onClick={() => setEditingField(null)} style={{ minHeight: 36, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", borderRadius: 4, fontSize: 11, fontWeight: 700, textTransform: "uppercase", cursor: "pointer", width: "100%" }}>Cancel</button>
                </div>
              )}
              <div style={{ height: 1, background: "#2a2a2a", margin: "18px 0" }} />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 600, color: "#8a8a8a" }}>
                <span>MEMBER SINCE {me.joined_label}</span>
                <span style={{ color: "#fff", letterSpacing: ".1em" }}>{me.code}</span>
              </div>
            </div>
            {ongoingEvent && (
              <div style={{ marginTop: 20, background: "#e52240", padding: "20px 22px" }}>
                <div className="pulse-badge" style={{ display: "inline-block", background: "#c81e37", border: "1.5px solid rgba(255,255,255,0.5)", color: "#fff", fontSize: 11, fontWeight: 800, letterSpacing: ".2em", padding: "5px 10px", marginBottom: 12 }}>HAPPENING NOW</div>
                <div style={{ fontSize: 19, fontWeight: 800, lineHeight: 1.3, color: "#fff" }}>{ongoingEvent.name}</div>
                <div style={{ fontSize: 14, fontWeight: 600, color: "#fff", margin: "8px 0 14px", lineHeight: 1.5 }}>{eventDateLabel(ongoingEvent)} · {eventTimeLabel(ongoingEvent)} · {eventLocation(ongoingEvent, locations).name}</div>
                {checkinMap[ongoingEvent.id]?.has(me.id) ? (
                  <div style={{ fontSize: 13, fontWeight: 800, color: "#4ade80", letterSpacing: ".06em" }}>✓ CHECKED IN</div>
                ) : (
                  <div style={{ fontSize: 13, fontWeight: 800, color: "#fff", letterSpacing: ".06em" }}>YOU'RE RSVP'D — NOT CHECKED IN YET</div>
                )}
              </div>
            )}
            {nextEvent && (
              myCheckedIn ? (
                <div style={{ marginTop: 20, background: "#e52240", color: "#000", padding: "18px 20px" }}>
                  <div style={{ fontSize: 24, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 1 }}>Checked in</div>
                  <div style={{ fontSize: 12, fontWeight: 700, marginTop: 6, letterSpacing: ".06em" }}>{nextEvent.name.toUpperCase()} · {eventDateLabel(nextEvent)} · {eventTimeLabel(nextEvent)}</div>
                </div>
              ) : (
                <div style={{ marginTop: 20, border: "1px solid #232323", padding: "18px 20px" }}>
                  <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 8 }}>NEXT UP</div>
                  <div style={{ fontSize: 17, fontWeight: 800, lineHeight: 1.3 }}>{nextEvent.name}</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#7a7a7a", marginTop: 6, lineHeight: 1.5 }}>{eventDateLabel(nextEvent)} · {eventTimeLabel(nextEvent)} · {eventLocation(nextEvent, locations).name} · {eventLocation(nextEvent, locations).address}</div>
                  {nextEvent.hold ? (
                    <div style={{ marginTop: 12, padding: "10px 12px", background: "#2a2410", borderLeft: "3px solid #f0dc9a", display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: ".06em", color: "#f0dc9a" }}>WEATHER HOLD — EXPECT DELAY</span>
                    </div>
                  ) : (
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#e52240", marginTop: 12, letterSpacing: ".08em" }}>{myRsvp ? "YOU'RE RSVP'D" : "NOT RSVP'D YET"}</div>
                  )}
                </div>
              )
            )}
              </>
            )}
          </>
        )}

        {tab === "profile" && (
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 22 }}>
              <label style={{ position: "relative", flex: "0 0 auto", width: 78, height: 78, borderRadius: "50%", overflow: "hidden", cursor: "pointer", background: "#1a1a1a", border: "2px solid #e52240", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {me.photo_url ? (
                  <img src={me.photo_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                ) : (
                  <span style={{ fontSize: 26, fontWeight: 900, fontStyle: "italic", color: "#e52240" }}>{initials(me.first_name, me.last_name)}</span>
                )}
                <input type="file" accept="image/*" onChange={e => uploadPhoto(e.target.files[0])} style={{ position: "absolute", inset: 0, opacity: 0, cursor: "pointer" }} />
              </label>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#e52240", marginBottom: 8 }}>MEMBER SINCE {me.joined_label}</div>
                <h2 style={{ margin: 0, fontSize: 28, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.98 }}>{me.first_name} {me.last_name}</h2>
                <label style={{ display: "inline-block", position: "relative", fontSize: 10, fontWeight: 800, letterSpacing: ".16em", color: "#8a8a8a", cursor: "pointer", borderBottom: "1px solid #3a3a3a", paddingBottom: 2, marginTop: 8 }}>
                  {photoUploading ? "UPLOADING…" : (me.photo_url ? "CHANGE PHOTO" : "ADD PHOTO")}
                  <input type="file" accept="image/*" onChange={e => uploadPhoto(e.target.files[0])} style={{ position: "absolute", inset: 0, opacity: 0, cursor: "pointer" }} />
                </label>
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 22 }}>
              <div style={{ background: "#0f0f0f", borderTop: "3px solid #e52240", padding: "20px 16px" }}>
                <div style={{ fontSize: 52, fontWeight: 900, fontStyle: "italic", lineHeight: 0.9, color: "#e52240" }}>{me.runs}</div>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".14em", color: "#8a8a8a", marginTop: 10 }}>RUNS ATTENDED</div>
              </div>
              <div style={{ background: "#0f0f0f", borderTop: "3px solid #2a2a2a", padding: "20px 16px" }}>
                <div style={{ fontSize: 52, fontWeight: 900, fontStyle: "italic", lineHeight: 0.9 }}>{me.streak}</div>
                <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".14em", color: "#8a8a8a", marginTop: 10 }}>WEEK STREAK</div>
              </div>
            </div>

            <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 12 }}>MILESTONES</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              {MILESTONES.map(n => {
                const got = me.runs >= n;
                return (
                  <div key={n} style={{ flex: 1, textAlign: "center", padding: "14px 6px", border: "1px solid " + (got ? "#e52240" : "#232323"), background: got ? "#1a0a0e" : "transparent", color: got ? "#fff" : "#4a4a4a" }}>
                    <div style={{ fontSize: 24, fontWeight: 900, fontStyle: "italic", lineHeight: 1 }}>{n}</div>
                    <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".1em", marginTop: 4 }}>RUNS</div>
                  </div>
                );
              })}
            </div>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#7a7a7a", marginBottom: 24 }}>
              {(() => { const next = MILESTONES.find(n => n > me.runs); return next ? (next - me.runs) + " more to hit " + next + " runs" : "All milestones earned"; })()}
            </div>

            <div style={{ border: "1px solid #232323", padding: "16px 18px", marginBottom: 24 }}>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: ".2em", color: "#e52240", marginBottom: 10 }}>SHARE YOUR STRAVA</div>
              <input className="field" style={{ fontSize: 13, padding: 12 }} value={stravaLink} onChange={e => setStravaLink(e.target.value)} onBlur={saveStravaLink} placeholder="https://strava.app.link/..." />
              {stravaLink.trim() && (
                <>
                  <div style={{ background: "#fff", padding: 14, display: "flex", alignItems: "center", justifyContent: "center", marginTop: 14 }}>
                    <RealQr value={stravaLink.trim()} size={140} />
                    <RealQrFallback value={stravaLink.trim()} size={140} />
                  </div>
                  <div style={{ fontSize: 11, fontWeight: 600, color: "#6a6a6a", marginTop: 8, textAlign: "center" }}>Other runners can scan this to follow you on Strava.</div>
                </>
              )}
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              <button onClick={() => setProfilePanel("checkins")} style={{ flex: 1, minHeight: 40, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 800, letterSpacing: ".08em", background: profilePanel === "checkins" ? "#e52240" : "#121212", border: "1px solid " + (profilePanel === "checkins" ? "#e52240" : "#2a2a2a"), color: profilePanel === "checkins" ? "#000" : "#8a8a8a" }}>RECENT CHECK-INS</button>
              <button onClick={() => setProfilePanel("guidelines")} style={{ flex: 1, minHeight: 40, cursor: "pointer", borderRadius: 2, fontSize: 10, fontWeight: 800, letterSpacing: ".08em", background: profilePanel === "guidelines" ? "#e52240" : "#121212", border: "1px solid " + (profilePanel === "guidelines" ? "#e52240" : "#2a2a2a"), color: profilePanel === "guidelines" ? "#000" : "#8a8a8a" }}>GUIDELINES</button>
            </div>

            {profilePanel === "checkins" ? (
              <div style={{ display: "flex", flexDirection: "column" }}>
                {myHistory.length === 0 && <div style={{ fontSize: 12, color: "#6a6a6a", padding: "12px 0" }}>No check-ins yet.</div>}

                  <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 0", borderBottom: "1px solid #191919" }}>
                    <span style={{ fontSize: 14, fontWeight: 700 }}>{h.name}</span>
                    <span style={{ fontSize: 12, fontWeight: 600, color: "#7a7a7a", letterSpacing: ".06em" }}>{h.date}</span>

                <label className="label">PHONE NUMBER</label>
                <input className="field" type="tel" value={editPhone} onChange={e => setEditPhone(e.target.value)} placeholder="(202) 555-0100" style={{ marginBottom: 12 }} />

                  <span style={{ flex: "0 0 20px", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 900, background: editSmsOptIn ? "#e52240" : "transparent", border: "2px solid " + (editSmsOptIn ? "#e52240" : "#3a3a3a"), color: "#000" }}>{editSmsOptIn ? "✓" : ""}</span>

                </button>
                <div style={{ height: 1, background: "#1e1e1e", margin: "0 0 14px" }} />
                {editProfileMsg && <div className={editProfileMsg.includes("wrong") || editProfileMsg.includes("Add a") ? "err" : "ok"} style={{ marginBottom: 12 }}>{editProfileMsg}</div>}
                <button className="btn-primary" disabled={editProfileSaving} onClick={saveProfilePhone} style={{ marginBottom: 8 }}>{editProfileSaving ? "Saving…" : "Save"}</button>
                <button onClick={() => { setEditingProfile(false); setEditProfileMsg(""); }} style={{ width: "100%", minHeight: 36, background: "transparent", color: "#8a8a8a", border: "1px solid #2a2a2a", borderRadius: 4, fontSize: 11, fontWeight: 700, textTransform: "uppercase", cursor: "pointer" }}>Cancel</button>
              </div>
            ) : (
              <button className="btn-ghost" onClick={() => { setEditPhone(me.phone || ""); setEditSmsOptIn(!!me.sms_opt_in); setEditProfileMsg(""); setEditingProfile(true); }} style={{ marginTop: 22 }}>Edit profile</button>
            )}

            <button className="btn-ghost" onClick={signOut} style={{ marginTop: 12, background: "none", border: "none", color: "#6a6a6a", fontSize: 12, fontWeight: 700, letterSpacing: ".14em", textTransform: "uppercase", cursor: "pointer", padding: "12px 0", textAlign: "left", width: "auto" }}>Sign out</button>
          </div>
        )}

        {tab === "runs" && (
          <div>
            <h2 style={{ margin: "0 0 6px", fontSize: 30, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", lineHeight: 0.98 }}>This week</h2>
            <p style={{ margin: "0 0 22px", fontSize: 13, fontWeight: 600, color: "#8a8a8a", lineHeight: 1.6 }}>RSVP so captains know the headcount. Your QR still checks you in either way.</p>
            {myRaceRegs.map(reg => (
              <div key={reg.id} style={{ background: "#000", border: "1px solid #232323", padding: "18px 20px", marginBottom: 14 }}>
                <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".2em", color: "#8a8a8a", marginBottom: 10 }}>YOU'RE REGISTERED</div>
                <img src={D19_TITLE_IMG} alt="District 19" style={{ width: "100%", display: "block", marginBottom: 14 }} />
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  {reg.event_name && (
                    <span style={{ background: "#f21011", color: "#fff", fontSize: 11, fontWeight: 900, padding: "3px 10px", letterSpacing: ".05em" }}>{reg.event_name}</span>
                  )}
                  <span style={{ fontSize: 12, fontWeight: 600, color: "#b4b4b4" }}>{reg.event_date ? new Date(reg.event_date + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : ""}{reg.bib_num ? " · Bib " + reg.bib_num : ""}</span>
                </div>
                <div style={{ display: "flex", height: 6, marginTop: 14 }}>
                  <div style={{ flex: 1, background: "#f21011" }} />
                  <div style={{ flex: 1, background: "#23ff01" }} />
                  <div style={{ flex: 1, background: "#1025ee" }} />
                </div>
              </div>
            ))}
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {sortedEvents.map(x => {
                const on = rsvpMap[x.id]?.has(me.id);
                const checkedIn = checkinMap[x.id]?.has(me.id);
                const isPast = !x.cancelled && eventIsPast(x);
                return (
                  <div key={x.id} className="card" style={{ opacity: (x.cancelled || isPast) ? 0.5 : 1 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div style={{ fontSize: 10, fontWeight: 800, color: "#e52240", letterSpacing: ".1em" }}>{eventDateLabel(x)} · {eventTimeLabel(x)}</div>
                      {checkedIn && <div style={{ fontSize: 10, fontWeight: 800, color: isPast ? "#e52240" : "#4ade80", letterSpacing: ".08em" }}>{isPast ? "✓ ATTENDED" : "✓ CHECKED IN"}</div>}

                    <div style={{ fontSize: 18, fontWeight: 900, fontStyle: "italic", textTransform: "uppercase", margin: "6px 0" }}>{x.name}</div>
                    <div style={{ fontSize: 12, color: "#8a8a8a", marginBottom: 12 }}>{eventLocation(x, locations).name} · {eventLocation(x, locations).address}</div>

                    <button className="btn-ghost" disabled={x.cancelled || isPast} onClick={() => toggleRsvp(x.id)} style={{ background: on && !isPast ? "#e52240" : "transparent", color: on && !isPast ? "#000" : "#e52240", borderColor: "#e52240" }}>

                  </div>
